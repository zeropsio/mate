packages:
  - apps/*
  - infra/*
  - oxlint-plugin-t3code
  - packages/*
  - scripts

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  msw: false
  node-pty: true
  sharp: true
  utf-8-validate: false
  workerd: false

catalog:
  "@clerk/backend": 3.14.0
  "@clerk/clerk-js": 6.30.1
  "@clerk/electron": 0.0.37
  "@clerk/electron-passkeys": 0.0.3
  "@clerk/expo": 4.2.0
  "@clerk/shared": 4.30.1
  "@effect/atom-react": 4.0.0-rc.115
  "@effect/openapi-generator": 4.0.0-rc.115
  "@effect/platform-bun": 4.0.0-rc.115
  "@effect/platform-node": 4.0.0-rc.115
  "@effect/platform-node-shared": 4.0.0-rc.115
  "@effect/sql-pg": 4.0.0-rc.115
  "@effect/sql-sqlite-bun": 4.0.0-rc.115
  "@effect/tsgo": 0.41.0
  "@effect/vitest": 4.0.0-rc.115
  "@legendapp/list": 3.3.5
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@pierre/diffs": 1.3.0-beta.10
  "@types/node": 24.12.4
  effect: 4.0.0-rc.115
  jose: 6.2.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  yaml: ^2.9.0

minimumReleaseAgeExclude:
  - "@clerk/backend@3.14.0"
  - "@clerk/clerk-js@6.30.1"
  - "@clerk/electron@0.0.37"
  - "@clerk/expo@4.2.0"
  - "@clerk/shared@4.30.1"
  - "@effect/atom-react@4.0.0-rc.115"
  - "@effect/openapi-generator@4.0.0-rc.115"
  - "@effect/platform-bun@4.0.0-rc.115"
  - "@effect/platform-node-shared@4.0.0-rc.115"
  - "@effect/platform-node@4.0.0-rc.115"
  - "@effect/sql-pg@4.0.0-rc.115"
  - "@effect/sql-sqlite-bun@4.0.0-rc.115"
  - "@effect/vitest@4.0.0-rc.115"
  - effect@4.0.0-rc.115
  - "@legendapp/list@3.3.5"
  - electron@44.4.2
  - "@anthropic-ai/claude-agent-sdk@0.3.276"
