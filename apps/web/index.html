          iris: {

              sidebar: "oklch(0.266743 0.044689 294.138)",
            },
          },

          Object.entries(BUILT_IN_THEME_PALETTES).map(([id, palettes]) => [
            id,
            Object.keys(palettes),
          ]),
        );
        const RESERVED_THEME_IDS = [
          "system",
          "light",
          "dark",
          "zerops",
          "t3-chat",
          "grove",
          "ocean",
          "ember",
          "iris",
          "t3-chat-dark",
          "t3-grove",
          "t3-ocean",
          "t3-ember",
          "t3-iris",
        ];
        // Update every theme-color meta so any element another layer added
        // carries the resolved color too.
        const setThemeColor = (color) => {
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.setAttribute("content", color);
          }
        };

        // The runtime decodes the same literal CSS formats into OKLCH. Keep
        // contextual colors out: they cannot be resolved from stored data.
        const SYSTEM_COLOR_KEYWORD =
          /^(?:accentcolor(?:text)?|active(?:border|caption|text)|appworkspace|background|button(?:border|face|highlight|shadow|text)|canvas(?:text)?|captiontext|field(?:text)?|graytext|highlight(?:text)?|inactive(?:border|caption(?:text)?)|info(?:background|text)|linktext|mark(?:text)?|menu(?:text)?|scrollbar|selecteditem(?:text)?|threed(?:darkshadow|face|highlight|lightshadow|shadow)|visitedtext|window(?:frame|text)?)$/i;
        const isThemeColor = (value) => {
          if (typeof value !== "string" || typeof CSS === "undefined") return false;
          const color = value.trim();
          if (
            /^(?:currentcolor|inherit|initial|revert|revert-layer|unset)$/i.test(color) ||
            SYSTEM_COLOR_KEYWORD.test(color) ||
            /\bfrom\b|(?:var|env|attr|calc|min|max|clamp)\(/i.test(color)
          ) {
            return false;
          }
          const isLiteralColor =
            /^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(color) ||
            /^[a-z]+$/i.test(color) ||
            /^(?:rgba?|hsla?|hwb|lab|lch|oklab|oklch|color)\(/i.test(color);
          return isLiteralColor && CSS.supports("color", color);
        };
        const isRecord = (value) =>
          typeof value === "object" && value !== null && !Array.isArray(value);
        const isThemeId = (value) =>
          typeof value === "string" && /^[a-z0-9](?:[a-z0-9-]{0,47})$/.test(value);
        const isThemeLabel = (value) =>
          typeof value === "string" && value.trim().length > 0 && value.trim().length <= 48;
        const isThemePreferenceMode = (value) =>
          value === "light" || value === "dark" || value === "system";
        const isThemeAppearance = (value) => value === "light" || value === "dark";
        const isStoredCustomTheme = (value) => {
          if (
            !isRecord(value) ||
            !isThemeId(value.id) ||
            RESERVED_THEME_IDS.includes(value.id) ||
            !isThemeLabel(value.label) ||
            !isThemeAppearance(value.appearance) ||
            !isRecord(value.colors)
          ) {
            return false;
          }
          if (value.variants === undefined) return true;
          if (!isRecord(value.variants)) return false;
          return Object.entries(value.variants).every(
            ([appearance, colors]) =>
              isThemeAppearance(appearance) &&
              (appearance === value.appearance || isRecord(colors)),
          );
        };
        const findCustomTheme = (themeId) => {
          if (RESERVED_THEME_IDS.includes(themeId)) return null;
          try {
            const parsed = JSON.parse(
              window.localStorage.getItem(CUSTOM_THEMES_STORAGE_KEY) ?? "null",
            );
            if (!Array.isArray(parsed)) return null;
            return (
              parsed.find((value) => isStoredCustomTheme(value) && value.id === themeId) ?? null
            );
          } catch {
            return null;
          }
        };

        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          // Older builds stored the dark T3 Chat palette as its own theme id
          // and every maintainer theme under a t3- prefix; keep those
          // preferences readable. Mirrors the runtime's legacy alias table.
          const LEGACY_THEME_IDS = {
            "t3-chat-dark": "t3-chat",
            "t3-grove": "grove",
            "t3-ocean": "ocean",
            "t3-ember": "ember",
            "t3-iris": "iris",
          };
          const isLegacyT3ChatDark = storedTheme === "t3-chat-dark";
          const storedThemeId =
            storedTheme === null ? "" : (LEGACY_THEME_IDS[storedTheme] ?? storedTheme);
          // No preference, or one this build does not know, is the runtime's
          // default — the Zerops palette following the OS (`readThemePreference`)
          // — so the first frame is painted in what React then paints.
          const themeId =
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system" ||
            BUILT_IN_THEME_MODES[storedThemeId] !== undefined ||
            findCustomTheme(storedThemeId) !== null
              ? storedThemeId
              : "zerops";
          const legacyMode = isLegacyT3ChatDark ? "dark" : null;
          const builtInModes = BUILT_IN_THEME_MODES[themeId] ?? null;
          const customTheme = builtInModes ? null : findCustomTheme(themeId);
          const themeModes =
            builtInModes ??
            (customTheme
              ? ["light", "dark"].filter(
                  (mode) => mode === customTheme.appearance || customTheme.variants?.[mode],
                )
              : null);
          // Mirrors the runtime's isKnownThemePreference.
          const isKnownTheme =
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system" ||
            themeModes !== null;
          const theme = isKnownTheme && storedTheme ? storedTheme : "system";
          const isThemed = isKnownTheme && themeModes !== null;
          const baseAppearance = customTheme ? customTheme.appearance : "light";
          const systemMode = prefersDark ? "dark" : "light";
          const storedAppearanceMode = window.localStorage.getItem(
            THEME_APPEARANCE_MODE_STORAGE_KEY,
          );
          const storedFollowSystem = window.localStorage.getItem(THEME_FOLLOW_SYSTEM_STORAGE_KEY);
          // Mirrors the runtime's getThemePreferenceMode fallback: a bare
          // "light"/"dark" preference names its own mode.
          const preferenceMode =
            theme === "light" || theme === "dark" ? theme : (legacyMode ?? baseAppearance);
          const appearanceMode = isThemePreferenceMode(storedAppearanceMode)
            ? storedAppearanceMode
            : storedFollowSystem === "true"
              ? "system"
              : storedFollowSystem === "false"
                ? preferenceMode
                : theme === "system" || themeId === "zerops"
                  ? "system"
                  : preferenceMode;

          // light vs dark even when the base theme cannot render that mode.
          // Mirrors the runtime's halves-aware resolveThemeAppearance.
          const wantedMode = appearanceMode === "system" ? systemMode : appearanceMode;
          let halfThemeId = null;
          let halfCustomTheme = null;
          try {
            const halvesRaw = JSON.parse(
              window.localStorage.getItem(THEME_HALVES_STORAGE_KEY) ?? "null",
            );
            const candidate = isRecord(halvesRaw) ? halvesRaw[wantedMode] : null;
            if (typeof candidate === "string") {
              const halfId = LEGACY_THEME_IDS[candidate] ?? candidate;
              const halfBuiltIn = BUILT_IN_THEME_MODES[halfId] ?? null;
              const halfCustom = halfBuiltIn ? null : findCustomTheme(halfId);
              const halfModes =
                halfBuiltIn ??
                (halfCustom
                  ? ["light", "dark"].filter(
                      (mode) => mode === halfCustom.appearance || halfCustom.variants?.[mode],
                    )
                  : null);
              if (halfModes && halfModes.includes(wantedMode)) {
                halfThemeId = halfId;
                halfCustomTheme = halfCustom;
              }
            }
          } catch {
            // A malformed mix degrades to the base preference.
          }
          const themeMode = !isThemed
            ? null
            : appearanceMode === "system"
              ? themeModes.includes(systemMode)
                ? systemMode
                : baseAppearance
              : themeModes.includes(appearanceMode)
                ? appearanceMode
                : baseAppearance;
          const isDark =
            halfThemeId !== null
              ? wantedMode === "dark"
              : isThemed
                ? themeMode === "dark"
                : appearanceMode === "system"
                  ? prefersDark
                  : appearanceMode === "dark";
          const effectiveIsThemed = halfThemeId !== null || isThemed;
          const effectiveThemeId = halfThemeId ?? themeId;
          const effectiveCustomTheme = halfThemeId !== null ? halfCustomTheme : customTheme;
          const effectiveThemeMode = halfThemeId !== null ? wantedMode : themeMode;
          const customColors =
            effectiveIsThemed && effectiveCustomTheme
              ? effectiveThemeMode === effectiveCustomTheme.appearance
                ? effectiveCustomTheme.colors
                : (effectiveCustomTheme.variants?.[effectiveThemeMode] ??
                  effectiveCustomTheme.colors)
              : null;
          const customDefaults =
            effectiveCustomTheme && effectiveThemeMode
              ? DEFAULT_THEME_PALETTES[effectiveThemeMode]
              : null;
          // The runtime tolerates individual malformed colors, so fall back
          // per role rather than dropping the theme.
          const builtInSplash =
            effectiveIsThemed && !effectiveCustomTheme && effectiveThemeMode
              ? (BUILT_IN_THEME_PALETTES[effectiveThemeId]?.[effectiveThemeMode] ?? null)
              : null;
          const fallbackSplash = isDark ? SPLASH_COLORS.dark : SPLASH_COLORS.light;
          const customSplash = customColors
            ? {
                background: isThemeColor(customColors.canvas)
                  ? customColors.canvas
                  : (customDefaults?.background ?? fallbackSplash.background),
                foreground: isThemeColor(customColors.text)
                  ? customColors.text
                  : (customDefaults?.foreground ?? fallbackSplash.foreground),
                accent: isThemeColor(customColors.accent)
                  ? customColors.accent
                  : (customDefaults?.accent ?? fallbackSplash.accent),
                sidebar: isThemeColor(customColors.sidebar)
                  ? customColors.sidebar
                  : (customDefaults?.sidebar ?? fallbackSplash.sidebar),
              }
            : null;
          if (effectiveIsThemed) {
            document.documentElement.dataset.themeId = effectiveCustomTheme
              ? effectiveCustomTheme.id
              : effectiveThemeId;
          } else {
            delete document.documentElement.dataset.themeId;
          }
          // A resolved half is a selection even when the base theme is gone
          // (deleting the base leaves the mix pointing at a real theme).
          const hasSelection = halfThemeId !== null || (isKnownTheme && storedTheme !== null);
          if (hasSelection || effectiveIsThemed) {
            document.documentElement.dataset.themeSelected = "true";
          } else {
            delete document.documentElement.dataset.themeSelected;
          }
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = customColors
            ? isThemeColor(customColors.chrome)
              ? customColors.chrome
              : (customDefaults?.chrome ?? fallbackSplash.background)
            : builtInSplash
              ? builtInSplash.chrome
              : isDark
                ? DARK_BACKGROUND
                : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          // The splash takes the palette React will paint: a chosen theme's, or
          // the default one's.
          if (hasSelection || effectiveIsThemed) {
            const splashColors = customSplash ?? builtInSplash ?? fallbackSplash;
            for (const [name, value] of Object.entries(splashColors)) {
              document.documentElement.style.setProperty(`--boot-${name}`, value);
            }
          }
          setThemeColor(chromeColor);
        } catch {
          // Mirror the runtime's storage-failure fallback: follow the OS.
          let prefersDark = true;
          try {
            prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {
            // Keep the dark default when even matchMedia is unavailable.
          }
          delete document.documentElement.dataset.themeId;
          delete document.documentElement.dataset.themeSelected;
          document.documentElement.classList.toggle("dark", prefersDark);
          const fallbackColor = prefersDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = fallbackColor;
          setThemeColor(fallbackColor);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html.dark body {
        background: #0a0a0a;
        color: #f5f5f5;
      }

      /* The first frame, kept until the app draws into #root: the sign-in's
         centred mark, or — for a browser signed in last time — the app's own
         frame, the menu column with its mark where the menu draws it
         (SidebarChrome's 28 x 33 at 16, 16) and a quiet page. The app's waits
         draw their one line into #boot-shell-page (bootFrame.ts). */
      #boot-shell {
        position: fixed;
        inset: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
      }

      #boot-shell[hidden] {
        display: none;
      }

      html[data-theme-selected="true"] #boot-shell {
        background: var(--boot-background);
        color: var(--boot-foreground);
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }

      #boot-shell-menu,
      #boot-shell-page {
        display: none;
      }

      html[data-boot-frame="app"] #boot-shell-card {
        display: none;
      }

      html[data-boot-frame="app"] #boot-shell-page {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @media (min-width: 768px) {
        html[data-boot-frame="app"] #boot-shell-menu {
          position: absolute;
          inset: 0 auto 0 0;
          display: block;
          box-sizing: border-box;
          width: var(--boot-menu-width, 304px);
          /* The menu's edge: its text at 10 % (8 % dark), as [data-app-sidebar] draws it. */
          border-right: 1px solid
            color-mix(in srgb, var(--boot-foreground, currentColor) 10%, transparent);
          background-color: var(--boot-sidebar, transparent);
          background-clip: padding-box;
          background-image: var(--surface-grain, none);
          background-size: var(--surface-grain-size, auto);
        }

        html.dark[data-boot-frame="app"] #boot-shell-menu {
          border-right-color: color-mix(
            in srgb,
            var(--boot-foreground, currentColor) 8%,
            transparent
          );
        }

        /* The menu's loading rows, where and as SidebarZeropsTree's MenuSkeleton draws them
           under the menu's header, until the app draws the menu (or its preview, its rows). */
        html[data-boot-frame="app"] #boot-shell-menu-loading {
          position: absolute;
          top: 65px;
          right: 8px;
          left: 9px;
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 8px 10px;
        }

        #boot-shell-menu:has(> :not(#boot-shell-menu-loading)) > #boot-shell-menu-loading {
          display: none;
        }

        #boot-shell-menu-loading > div {
          display: flex;
          align-items: center;
          gap: 12px;
          height: 28px;
        }

        #boot-shell-menu-loading span {
          flex-shrink: 0;
          width: 20px;
          height: 20px;
          border-radius: 9999px;
          background: color-mix(in srgb, var(--boot-sidebar, #fafafa) 50%, #fff);
        }

        #boot-shell-menu-loading span + span {
          flex-shrink: 1;
          width: 66.6667%;
          height: 8px;
        }

        html.dark #boot-shell-menu-loading span {
          background: color-mix(in srgb, var(--boot-foreground, #f5f5f5) 8%, transparent);
        }

        html[data-boot-frame="app"] #boot-shell-page {
          left: var(--boot-menu-width, 304px);
        }

        html[data-boot-frame="app"] #boot-shell-card {
          position: absolute;
          top: 16px;
          left: 16px;
          display: block;
          width: 28px;
          height: 33px;
        }

        html[data-boot-frame="app"] #boot-shell-logo {
          display: block;
          width: 28px;
          height: 33px;
        }
      }
    </style>
    <script>
      // Which first frame: the app's, for a browser whose last session was
      // signed in (`mate:boot-frame`, written by the session, cleared on sign
      // out) and still holds it, or one coming back from the Zerops sign-in;
      // else, and in a desktop window, the sign-in's centred mark. The menu
      // column takes the width the menu will (`resolveInitialThreadSidebarWidth`).
      // Mirrored by bootFrame.logic.ts.
      (() => {
        const root = document.documentElement;
        if (window.desktopBridge !== undefined) return;
        let signedIn = false;
        try {
          signedIn =
            window.localStorage.getItem("mate:boot-frame") === "app" &&
            window.localStorage.getItem("zerops-mate.zerops-session.v1") !== null;
        } catch {
          // Storage refused: the sign-in's frame, unless this is its return.
        }
        const returning = /\/zerops\/authorized\/?$/i.test(window.location.pathname);
        if (!signedIn && !returning) return;
        root.dataset.bootFrame = "app";
        let stored = null;
        try {
          const raw = JSON.parse(
            window.localStorage.getItem("chat_thread_sidebar_width") ?? "null",
          );
          stored = typeof raw === "number" && Number.isFinite(raw) ? raw : null;
        } catch {
          stored = null;
        }
        const minimum = 13 * 16;
        const maximum = Math.max(minimum, Math.floor(window.innerWidth) - 40 * 16);
        const preferred = stored === null ? 19 * 16 : Math.max(minimum, stored);
        root.style.setProperty("--boot-menu-width", `${Math.min(preferred, maximum)}px`);
      })();
    </script>
