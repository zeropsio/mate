# Zerops runtime spec for this repository.
#
# `zcli service deploy`, `zcli service push` and `buildFromGit` all read this
# file from the repository root — an inline `zeropsYaml` in an import document
# does not substitute for it. One `setup:` per deployable; the deploy selects
# one by service hostname, or by an explicit `--setup`.
zerops:
  # The z3 web client, served at an origin root by its own nginx: the delivery
  # shape the hosted client needs (spec-z3 §4 — "hosted separately, not built
  # into the container"). The same bundle the container serves under /z3/,
  # built without the prefix.
  #
  # Deploy-only on purpose: with no `build:` section, `zcli service deploy`
  # hits PUT /app-version/{id}/deploy and no build container ever starts — it
  # uploads a directory that is already built. `zcli service push` (PUT
  # /app-version/{id}/build-and-deploy) would instead upload `git archive HEAD`,
  # which for this monorepo is ~200 MB, 126 MB of it vendored reference
  # repositories under .repos/, on every single deploy.
  #
  # Everything that differs between the two published channels — the channel
  # label, the canonical public URL, the version the client reports — is
  # deployment configuration rather than a repository fact, so it lives in
  # scripts/deploy-web.sh next to the service it applies to, not here. That is
  # what keeps this file true for both channels at once.
  - setup: z3web
    run:
      base: alpine/static@1.0
      routing:
        # A Static service takes its document root from `routing`, not from
        # `documentRoot` — that one is for webserver runtimes and is silently
        # ignored here, leaving nginx on /var/www and every request a 404.
        root: dist
        # A header value is interpolated RAW into nginx's `add_header`, so one
        # containing spaces or commas has to carry its own quotes: unquoted,
        # `nginx -t` rejects the config and the deploy fails with a bare
        # `commandExec exit status 1` and no log line anywhere. The trailing
        # `always` is what makes the header survive non-200 responses.
        headers:
          # Vite content-hashes everything under /assets, so a given URL's
          # bytes never change. Without this the browser keeps no copy at all
          # and revalidates every asset on every page load, against whichever
          # region the service happens to run in.
          - for: /assets/*
            values:
              Cache-Control: "'public, max-age=31536000, immutable' always"
          # Everything else is the SPA shell — the catch-all answers any
          # unmatched path with index.html — plus version.json, which the
          # deploy smoke check reads. Both have to reflect a deploy at once.
          # The longer /assets/ prefix wins over this one (verified live).
          - for: /*
            values:
              Cache-Control: "'no-cache' always"
    deploy:
      # Runs inside the container against nginx's own port, so a version that
      # unpacked but never came up cannot take over from one that is serving.
      readinessCheck:
        httpGet:
          port: 80
          path: /
