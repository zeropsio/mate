name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject untracked package shells
        run: |
          test -z "$(git ls-files packages/ssh packages/tailscale)" &&
            test ! -d packages/ssh -a ! -d packages/tailscale || {
            printf '%s\n' 'packages/ssh and packages/tailscale were deleted at the freeze; a directory here means a workspace manifest or script still expects them.'
            exit 1
          }

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check imported.lock
        run: node scripts/imported-lock.ts --check

      - name: Check showcase scenes
        run: node scripts/showcase-scenes.ts --check

      - name: mate zone architecture
        run: vp test run scripts/mate-zone-architecture.test.ts

      # One AST scan reconciles every ledger and checks the identity ratchets.
      - name: Reconcile guard exceptions
        run: node scripts/check-guard-exceptions.ts

      - name: Check test sentence retention
        run: node scripts/check-test-sentences.ts

      - name: Check CSS motion
        run: node scripts/check-css-motion.ts

      - name: Check CSS theme tokens
        run: node scripts/check-css-tokens.ts

      - name: Check generated theme tokens
        run: node scripts/generate-theme-tokens.ts --check

      - name: Check generated mobile themes
        run: vp run --filter @t3tools/mobile generate -- --check

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Typecheck scenarios
        run: vp exec tsc --noEmit --incremental -p apps/web/test/scenarios/tsconfig.json

      # `t3#build` depends on `@t3tools/web#build`: the production web and server
      # bundles, built on every run. The desktop half builds in Desktop Smoke.
      - name: Build server bundle
        run: vp run --filter t3 build

  # Every job gated on the `changes` outputs below runs unless the gate said
  # an explicit "false": a gate that failed leaves the output empty, and that
  # must run the job rather than silently skip it. `!cancelled()` keeps a
  # failed gate from skipping its dependents outright.
  desktop_smoke:
    name: Desktop Smoke
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.desktop != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build desktop pipeline
        env:
          VITE_HTTP_URL: ""
          VITE_WS_URL: ""
        run: |
          VITE_HOSTED_APP_CHANNEL="$(node --input-type=module -e 'import { resolveDesktopUpdateChannel } from "./scripts/stage-desktop-web.ts"; import pkg from "./apps/server/package.json" with { type: "json" }; process.stdout.write(resolveDesktopUpdateChannel(pkg.version));')"
          export VITE_HOSTED_APP_CHANNEL
          vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Stage desktop web bundle
        run: node scripts/stage-desktop-web.ts --skip-build

      - name: Diagnose Linux Electron runtime
        continue-on-error: true
        run: |
          electron_binary="$(cd apps/desktop && node -e 'process.stdout.write(require("electron"))')"
          ldd "$electron_binary" | grep "not found" || true
          xvfb-run -a -s "-screen 0 1440x900x24" "$electron_binary" --version

      - name: Smoke test desktop
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" vp run --filter @t3tools/desktop smoke-test 2>&1 |
            tee "${{ runner.temp }}/desktop-smoke-log.txt"

      - name: Upload desktop smoke capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-capture
          path: |
            ${{ runner.temp }}/desktop-smoke-*/smoke.png
            ${{ runner.temp }}/desktop-smoke-log.txt
          if-no-files-found: warn
          retention-days: 7

  chat_gate:
    name: Chat Contract (A + B + Typecheck)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.chat != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Cache the scenarios' Chrome for Testing
        uses: actions/cache@v4
        with:
          path: ~/.cache/mate-test-browser
          key: mate-test-browser-${{ runner.os }}-${{ hashFiles('apps/web/test/testBrowser.ts') }}

      - name: Provider goldens, client wire journeys and typecheck
        run: node scripts/chat-gate.ts

  # Everything except `t3` (apps/server), `@t3tools/web` and `@t3tools/mobile`,
  # which have runners of their own. `--parallel` drops the package dependency ordering that
  # `vp run` applies by default: these `test` tasks declare no `dependsOn` and
  # resolve workspace deps from source, so ordering only bought us idle runners
  # between dependency layers. The concurrency limit stays at the default 4 so
  # peak load per runner is unchanged.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/web' --filter '!@t3tools/mobile' --filter '!@t3tools/monorepo' test

  test_mobile:
    name: Test Mobile
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mobile != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter @t3tools/mobile test

  # apps/web alone ran ~8.5 min inside Test and set the length of every CI run.
  # Its 669 files run in parallel workers, so two runners halve it.
  test_web:
    name: Test Web ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter @t3tools/web test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # apps/server sets `fileParallelism: false`, so its 239 files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly.
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces it. Published straight to the run's step summary — gated on
      # presence since only one shard writes it.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    name: Rust
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.resource_monitor != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  # Desktop, mobile and the resource monitor are clients the container bundle
  # does not ship, so a pull request pays for their jobs only when it touches
  # them or what they build on. A push to main runs them all. The mobile native
  # lint needs a macOS runner, which bills ~6.7x a Linux minute, so it stays
  # gated on its own sources on main too. Diff detection is API-only
  # and fails open: if the diff cannot be resolved, every gated job runs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      chat: ${{ steps.detect.outputs.chat }}
      desktop: ${{ steps.detect.outputs.desktop }}
      mobile: ${{ steps.detect.outputs.mobile }}
      resource_monitor: ${{ steps.detect.outputs.resource_monitor }}
      mobile_native: ${{ steps.detect.outputs.mobile_native }}
    steps:
      - name: Checkout gate selector
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /package.json
            /scripts/chat-gate.ts
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Detect changed areas
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          areas=(chat desktop mobile resource_monitor mobile_native)

          fail_open() {
            echo "$* Running every gated job."
            for area in "${areas[@]}"; do echo "${area}=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes an input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          chat=$(printf '%s\n' "$paths" | node scripts/chat-gate.ts --select) \
            || fail_open "Could not select the chat contract gate."
          echo "chat=${chat}" >> "$GITHUB_OUTPUT"

          gate() {
            local area="$1" pattern="$2"
            if grep -qE "$pattern" <<< "$paths"; then
              echo "${area}: changed"
              grep -m 20 -E "$pattern" <<< "$paths" | sed 's/^/  /'
              echo "${area}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${area}: unchanged"
              echo "${area}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # What every client builds on: the workspace manifests and toolchain
          # config, this workflow, and the packages the clients import. The
          # clients never import apps/server; they meet it over the contracts.
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|vite\.config\.ts|\.github/workflows/ci\.yml)$|^packages/(contracts|shared|client-runtime)/'

          if [[ -n "${PR_NUMBER}" ]]; then
            # Desktop Smoke stages the hosted web bundle through scripts/.
            gate desktop "${shared}|^apps/(desktop|web)/|^scripts/"
            gate mobile "${shared}|^apps/mobile/|^native/libghostty-vt/"
            gate resource_monitor '^native/resource-monitor/|^\.github/workflows/ci\.yml$'
          else
            echo "Push to main: desktop, mobile and resource monitor run in full."
            for area in desktop mobile resource_monitor; do echo "${area}=true" >> "$GITHUB_OUTPUT"; done
          fi

          # Sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command.
          gate mobile_native '^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mobile_native != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
