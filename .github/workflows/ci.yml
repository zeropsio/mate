name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject untracked package shells
        run: |
          test -z "$(git ls-files packages/ssh packages/tailscale)" &&
            test ! -d packages/ssh -a ! -d packages/tailscale || {
            printf '%s\n' 'packages/ssh and packages/tailscale were deleted at the freeze; a directory here means a workspace manifest or script still expects them.'
            exit 1
          }

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check imported.lock
        run: node scripts/imported-lock.ts --check

      - name: Check showcase scenes
        run: node scripts/showcase-scenes.ts --check

      - name: mate zone architecture
        run: vp test run scripts/mate-zone-architecture.test.ts

      # One AST scan reconciles every ledger and checks the identity ratchets.
      - name: Reconcile guard exceptions
        run: node scripts/check-guard-exceptions.ts

      - name: Check runtime cycle ratchet
        run: node scripts/check-runtime-cycles.ts

      - name: Check test sentence retention
        run: node scripts/check-test-sentences.ts

      - name: Check CSS motion
        run: node scripts/check-css-motion.ts

      - name: Check CSS theme tokens
        run: node scripts/check-css-tokens.ts

      - name: Check generated theme tokens
        run: node scripts/generate-theme-tokens.ts --check

      - name: Check
        run: git ls-files -z -- . ':!:apps/desktop/**' ':!:apps/mobile/**' | xargs -0 vp check --no-error-on-unmatched-pattern

      - name: Typecheck
        run: vp run --concurrency-limit 2 --filter '*' --filter '!@t3tools/monorepo' --filter '!@t3tools/desktop' --filter '!@t3tools/mobile' typecheck

      - name: Typecheck scenarios
        run: vp exec tsc --noEmit --incremental -p apps/web/test/scenarios/tsconfig.json

      # `t3#build` depends on `@t3tools/web#build`: the production web and server
      # bundles, built on every run.
      - name: Build server bundle
        run: vp run --filter t3 build

  # Every job gated on the `changes` outputs below runs unless the gate said
  # an explicit "false": a gate that failed leaves the output empty, and that
  # must run the job rather than silently skip it. `!cancelled()` keeps a
  # failed gate from skipping its dependents outright.
  chat_bundle:
    name: Chat Contract bundle
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.chat != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build the shared scenario bundle
        run: vp exec node apps/web/test/scenarios/harness/build.ts

      - name: Upload the content-addressed scenario bundle
        uses: actions/upload-artifact@v4
        with:
          name: chat-scenario-bundle
          path: node_modules/.cache/mate-scenario-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  chat_scenarios:
    name: Test Web Scenarios (${{ matrix.name }})
    needs: chat_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Measured C file durations are assigned in scripts/chat-gate.ts. The largest
        # suite gets its own runner; non-C uses Vitest's complete native inventory.
        include:
          - name: C shard 1
            command: node scripts/chat-gate.ts --verbose --stages C --shard 1/4
          - name: C shard 2
            command: node scripts/chat-gate.ts --verbose --stages C --shard 2/4
          - name: C shard 3
            command: node scripts/chat-gate.ts --verbose --stages C --shard 3/4
          - name: C shard 4
            command: node scripts/chat-gate.ts --verbose --stages C --shard 4/4
          - name: non-C shard 1
            command: >-
              vp -C apps/web test run --config test/scenarios/vitest.config.ts
              --project scenarios test/scenarios/areas
              --exclude 'test/scenarios/areas/c-mate/**' --shard 1/3 --allowOnly=false
              --reporter=default --reporter=../../scripts/chat-gate-reporter.ts
          - name: non-C shard 2
            command: >-
              vp -C apps/web test run --config test/scenarios/vitest.config.ts
              --project scenarios test/scenarios/areas
              --exclude 'test/scenarios/areas/c-mate/**' --shard 2/3 --allowOnly=false
              --reporter=default --reporter=../../scripts/chat-gate-reporter.ts
          - name: non-C shard 3
            command: >-
              vp -C apps/web test run --config test/scenarios/vitest.config.ts
              --project scenarios test/scenarios/areas
              --exclude 'test/scenarios/areas/c-mate/**' --shard 3/3 --allowOnly=false
              --reporter=default --reporter=../../scripts/chat-gate-reporter.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Cache the scenarios' Chrome for Testing
        uses: actions/cache@v4
        with:
          path: ~/.cache/mate-test-browser
          key: mate-test-browser-${{ runner.os }}-${{ hashFiles('apps/web/test/testBrowser.ts') }}

      - name: Download the shared scenario bundle
        uses: actions/download-artifact@v4
        with:
          name: chat-scenario-bundle
          path: node_modules/.cache/mate-scenario-web

      - name: Certify every case in this shard
        env:
          MATE_SCENARIO_REQUIRE_BUNDLE: "1"
        run: ${{ matrix.command }}

  # Scripts and HQ run on their own shards. Test keeps its existing context,
  # package tests and scenario drivers, and includes every split verdict.
  test:
    name: Test
    needs: [test_scripts, test_hq]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/web' --filter '!@t3tools/mobile' --filter '!@t3tools/desktop' --filter '!@t3tools/monorepo' --filter '!@t3tools/scripts' --filter '!@t3tools/hq' test

      - name: Test scenario drivers
        run: |
          vp run test:browser
          vp -C apps/web test run --config test/scenarios/vitest.config.ts --project scenario-drivers --allowOnly=false

      - name: Require every split package test job to pass
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true

  test_scripts:
    name: Test Scripts ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter @t3tools/scripts test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  test_hq:
    name: Test HQ ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter @t3tools/hq test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # apps/web alone ran ~8.5 min inside Test and set the length of every CI run.
  # Its 669 files run in parallel workers, so two runners halve it.
  test_web:
    name: Test Web ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter @t3tools/web test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # apps/server sets `fileParallelism: false`, so its files run strictly one at
  # a time. Sharding spreads them over separate runners instead of separate
  # workers, so no two server test files ever share a machine and the isolation
  # that flag buys is preserved exactly. Each shard deals every 4th file of the
  # sorted paths (scripts/lib/spread-shard.ts): about 340 s of tests each, where
  # three hash slices ran 390–525 s and the heaviest neared the 10-minute limit.
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          # Apply certification to the existing A/E/F inventory. The rest of the
          # server suite includes platform-specific skips and still runs in full.
          MATE_CHAT_GATE_SERVER: "1"
        run: >-
          vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --allowOnly=false --reporter=default --reporter=../../scripts/chat-gate-reporter.ts

      - name: Certify engine oracles
        if: matrix.shard == 1
        run: |
          vp exec tsc --noEmit --incremental -p apps/web/test/engine-oracle/tsconfig.json
          vp -C apps/web test run --project engine-oracle test/engine-oracle/runCard.oracle.test.ts test/engine-oracle/mateHealth.oracle.test.ts --allowOnly=false --reporter=default --reporter=../../scripts/chat-gate-reporter.ts

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces it. Published straight to the run's step summary — gated on
      # presence since only one shard writes it.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    name: Rust
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.resource_monitor != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  # PRs select the scenario bundle and resource monitor by their inputs. Main
  # runs both; an unresolved diff fails open to keep their coverage complete.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      chat: ${{ steps.detect.outputs.chat }}
      resource_monitor: ${{ steps.detect.outputs.resource_monitor }}
    steps:
      - name: Checkout workspace manifest
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Detect changed areas
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          areas=(chat resource_monitor)

          fail_open() {
            echo "$* Running every gated job."
            for area in "${areas[@]}"; do echo "${area}=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes an input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          gate() {
            local area="$1" pattern="$2"
            if grep -qE "$pattern" <<< "$paths"; then
              echo "${area}: changed"
              grep -m 20 -E "$pattern" <<< "$paths" | sed 's/^/  /'
              echo "${area}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${area}: unchanged"
              echo "${area}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # What every client builds on: the workspace manifests and toolchain
          # config, this workflow, and the packages the clients import. The
          # clients never import apps/server; they meet it over the contracts.
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|vite\.config\.ts|\.github/workflows/ci\.yml)$|^packages/(contracts|shared|client-runtime)/'

          # The bundle feeds every scenario area, all of which run real HQ Core.
          gate chat "${shared}|^apps/(hq|server|web)/|^packages/(effect-codex-app-server|effect-acp)/|^scripts/(chat-gate|gate-changed|test-postgres)"

          if [[ -n "${PR_NUMBER}" ]]; then
            gate resource_monitor '^native/resource-monitor/|^\.github/workflows/ci\.yml$'
          else
            echo "Push to main: resource monitor runs in full."
            echo "resource_monitor=true" >> "$GITHUB_OUTPUT"
          fi

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
