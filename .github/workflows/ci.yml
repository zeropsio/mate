# Pushes and pull requests run lint/format, typecheck and build only; every test suite and the test
# machinery (test sentences, scenario caps, test clock, resource monitor tests) run on a manual
# dispatch or a kh-bisect manifest naming them (scripts/ci-blame.ts selects).
# Execution budgets (minutes; queue/runner allocation is additional, not execution):
# Blocking CI <= 33 min = verification 3 + selection 9 + bundle 6 + State Smoke 14 + summary 1.
# Suite allocation: state_smoke 14; test_packages 12; other suites/cache 10;
# changes/Test/Release Smoke 1. Independent shards run concurrently; their bounds do not add.
# Signal <= 38 min = bundle 10 + shards 14 + classify 14 (signal.yml).
# Every browser shard and the entire classify rerun: 10 min process group + 10 sec KILL grace,
# inside an 11 min step and 14 min job (3 min setup/artifacts). Cases retain the 3 min ceiling;
# three consecutive time-bound failures stop admission, naming them, within 9 min + cleanup.
# State Smoke's measured selection budget is 9 min (scripts/state-smoke.ts); no cases are dropped.
# scripts/ci-workflow.test.ts checks the dependency sums and process/step/job nesting.
name: CI
run-name: CI · ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
      - kh-next
      - "kh-bisect/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_CONFIG_FETCH_RETRIES: "2"
  PNPM_CONFIG_FETCH_TIMEOUT: "60000"
  PNPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  PNPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"

concurrency:
  # Every main push is its own group: a group holds one pending run, so a shared main group lets a
  # newer push cancel the pending run a release waits for. kh-next, diagnostics and PRs keep only
  # their newest run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/kh-next' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/kh-bisect/') }}

jobs:
  verification:
    name: Prior CI verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.verdict.outputs.skip }}
      failed: ${{ steps.verdict.outputs.failed }}
      hq_ref_valid: ${{ steps.hq_ref_guard.outcome }}
    steps:
      - name: Checkout CI receipt
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /package.json
            /.mate-hq-ref
            /scripts/hq-ref.ts
            /scripts/ci-tree-runs.sh
          sparse-checkout-cone-mode: false

      - name: Checkout mate-hq main for promotion
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/kh-next') }}
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: zeropsio/mate-hq
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.MATE_HQ_DEPLOY_KEY }}
          path: mate-hq

      - name: Setup Node for the mate-hq pin
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Check mate-hq ref for verified promotion
        if: ${{ !cancelled() }}
        id: hq_ref_guard
        continue-on-error: true
        run: |
          if [[ "${GITHUB_EVENT_NAME:-}" == push && ( "${GITHUB_REF:-}" == refs/heads/main || "${GITHUB_REF:-}" == refs/heads/kh-next ) ]]; then
            node scripts/hq-ref.ts --check-main mate-hq
          else
            node scripts/hq-ref.ts > /dev/null
          fi

      - name: Check kh-next verification
        id: verdict
        # A missing or timed-out receipt leaves skip unset, so consumers run the full suite.
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HQ_REF_VALID: ${{ steps.hq_ref_guard.outcome }}
        run: |
          set -euo pipefail
          if [[ "${HQ_REF_VALID:-success}" != success ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source scripts/ci-tree-runs.sh
          skip=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            verified=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" --jq '
              .workflow_runs[]
              | select(.head_sha == env.GITHUB_SHA)
              | select(.head_branch == "kh-next")
              | select(.event == "push" and .status == "completed" and .conclusion == "success")
              | .id')
            if [[ -z "$verified" ]]; then
              # Promotions may change commit metadata without changing a single tree entry.
              verified=$(tree_runs ci.yml kh-next success)
            fi
            if [[ -n "$verified" ]]; then
              skip=true
              printf 'Verified kh-next CI run(s): %s\n' "$verified"
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/kh-next ]]; then
            # A hotfix pushed to main reaches kh-next with the same tree; main already ran it in full.
            candidates=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100" --jq '
              .workflow_runs[]
              | select(.head_sha == env.GITHUB_SHA and .head_branch == "main")
              | select(.event == "push" and .status == "completed" and .conclusion == "success")
              | .id')
            if [[ -z "$candidates" ]]; then
              candidates=$(tree_runs ci.yml main success)
            fi
            for run in $candidates; do
              if ran_in_full "$run" Check; then
                skip=true
                printf 'Verified main CI run: %s\n' "$run"
                break
              fi
            done
            if [[ "$skip" != true ]]; then
              # Integrate → Revert → re-Integrate pushes a tree kh-next already tested.
              for run in $(tree_runs ci.yml kh-next success); do
                if ran_in_full "$run" Check; then
                  skip=true
                  printf 'Verified kh-next CI run: %s\n' "$run"
                  break
                fi
              done
            fi
            if [[ "$skip" != true ]]; then
              # "Integrate main" reaches kh-next seconds after the hotfix push, while main's run of the
              # tree is still going. Wait on that run's own conclusion. A red main run is this tree's
              # verdict too, so this run fails with it; only a cancelled (superseded) run means a full
              # run here. The step's timeout-minutes is the only bound.
              for status in in_progress queued; do
                for run in $(tree_runs ci.yml main "$status"); do
                  if gh run watch "$run" --exit-status >/dev/null; then
                    if ran_in_full "$run" Check; then
                      skip=true
                      printf 'Verified main CI run: %s\n' "$run"
                      break 2
                    fi
                  elif [[ "$(gh run view "$run" --json conclusion --jq .conclusion)" == failure ]]; then
                    printf 'Main CI run %s failed on this tree; fix main, not kh-next.\n' "$run" >&2
                    echo "failed=true" >> "$GITHUB_OUTPUT"
                    exit 1
                  fi
                done
              done
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "Already verified: ${skip}"

  selection:
    name: CI selection
    needs: verification
    # Optional receipt failures fall back to full verification; a failed main receipt stops below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    outputs:
      skip: ${{ needs.verification.outputs.skip }}
      jobs: ${{ steps.blame.outputs.jobs }}
      blame: ${{ steps.blame.outputs.blame }}
      test_scripts: ${{ steps.blame.outputs.test_scripts }}
      test_client_runtime: ${{ steps.blame.outputs.test_client_runtime }}
      test_web: ${{ steps.blame.outputs.test_web }}
      test_server: ${{ steps.blame.outputs.test_server }}
      state_smoke: ${{ steps.state_smoke_plan.outputs.state_smoke }}
      state_smoke_selection: ${{ steps.state_smoke_plan.outputs.state_smoke_selection }}
      selection_manifest: ${{ steps.state_smoke_plan.outputs.selection_manifest || steps.blame.outputs.selection_manifest }}
      node_version: ${{ steps.node.outputs.version }}
    steps:
      - name: Reject invalid mate-hq pin
        env:
          HQ_REF_VALID: ${{ needs.verification.outputs.hq_ref_valid }}
        run: test "$HQ_REF_VALID" = success

      - name: Reject failed main verification
        env:
          MAIN_FAILED: ${{ needs.verification.outputs.failed }}
        run: test "$MAIN_FAILED" != true

      - name: Checkout CI selector
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /package.json
            /scripts/ci-blame.ts
            /.ci-blame-jobs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Select failed jobs for blame
        id: blame
        run: node scripts/ci-blame.ts

      # State Smoke's affected selection is computed once here; its size sets the shard count.
      - name: Checkout for State Smoke's plan
        if: &plans_state_smoke needs.verification.outputs.skip != 'true' && contains(fromJSON(steps.blame.outputs.jobs), 'state_smoke')
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        if: *plans_state_smoke
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        if: *plans_state_smoke
        id: paths
        shell: bash
        run: &store_path |
          echo "store=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Record the selector's resolved Node version
        if: *plans_state_smoke
        id: node
        run: &node_version echo "version=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"

      # Selection and every State Smoke job use the hosted install; main's cache job saves it.
      - name: Restore the hosted dependencies
        if: *plans_state_smoke
        id: hosted_modules
        uses: actions/cache/restore@v4
        with: &hosted_modules
          path: &hosted_modules_path |
            node_modules
            apps/*/node_modules
            infra/*/node_modules
            oxlint-plugin-t3code/node_modules
            packages/*/node_modules
            scripts/node_modules
          key: &hosted_modules_key hosted-modules-${{ runner.os }}-${{ steps.paths.outputs.arch }}-node${{ steps.node.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**', 'package.json', 'apps/*/package.json', 'infra/*/package.json', 'oxlint-plugin-t3code/package.json', 'packages/*/package.json', 'scripts/package.json') }}

      - name: Restore pnpm store
        if: &installs_hosted_modules needs.verification.outputs.skip != 'true' && contains(fromJSON(steps.blame.outputs.jobs), 'state_smoke') && steps.hosted_modules.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with: &pnpm_store
          path: ${{ steps.paths.outputs.store }}
          key: &pnpm_store_key vite-plus-${{ runner.os }}-${{ steps.paths.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vite-plus-${{ runner.os }}-${{ steps.paths.outputs.arch }}-pnpm-

      - name: Install dependencies
        if: *installs_hosted_modules
        env: &verified_lockfile
          PNPM_CONFIG_FROZEN_LOCKFILE: "true"
          PNPM_CONFIG_TRUST_LOCKFILE: "true"
        run: &hosted_dependencies vp install --frozen-lockfile --filter='!@t3tools/mobile' --filter='!@t3tools/desktop'

      - name: Plan State Smoke shards
        if: *plans_state_smoke
        id: state_smoke_plan
        env:
          MATE_SCENARIO_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          MATE_STATE_SMOKE_SHARDS: ${{ steps.blame.outputs.state_smoke_shards }}
          MATE_CI_SELECTION: ${{ steps.blame.outputs.selection_manifest }}
        run: node scripts/state-smoke.ts --plan --base "$MATE_SCENARIO_BASE" --shards "$MATE_STATE_SMOKE_SHARDS"

  scenario_bundle:
    name: State Smoke bundle
    needs: selection
    if: ${{ !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'state_smoke') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      node_version: ${{ steps.node.outputs.version }}
      hq_ref: ${{ steps.hq_ref.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ needs.selection.outputs.node_version }}
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Record the resolved Node version
        id: node
        run: *node_version

      - name: Restore the hosted dependencies
        id: hosted_modules
        uses: actions/cache/restore@v4
        with: *hosted_modules

      - name: Restore pnpm store
        if: steps.hosted_modules.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        if: steps.hosted_modules.outputs.cache-hit != 'true'
        env: *verified_lockfile
        run: *hosted_dependencies

      - name: Require the mate-hq deploy key for preflight
        env:
          MATE_HQ_DEPLOY_KEY: ${{ secrets.MATE_HQ_DEPLOY_KEY }}
        run: |
          if [ -z "$MATE_HQ_DEPLOY_KEY" ]; then
            echo '::error::Secret MATE_HQ_DEPLOY_KEY is absent; the pinned HQ preflight cannot run.'
            exit 1
          fi

      - name: Resolve the mate-hq ref
        id: hq_ref
        run: |
          ref=$(node scripts/hq-ref.ts)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout mate-hq
        uses: actions/checkout@v6
        with:
          repository: zeropsio/mate-hq
          ref: ${{ steps.hq_ref.outputs.ref }}
          ssh-key: ${{ secrets.MATE_HQ_DEPLOY_KEY }}
          path: mate-hq

      - name: Setup Go for mate-hq
        uses: actions/setup-go@v5
        with:
          go-version-file: mate-hq/go.mod
          cache: false

      - name: Install mate-hq and its services
        working-directory: mate-hq/conformance
        env: *verified_lockfile
        run: |
          vp install --frozen-lockfile
          ../scripts/ci-install-object-store.sh
          ../scripts/ci-install-postgres.sh

      - name: Preflight the pinned mate-hq contract
        env:
          MATE_HQ_TEST_COMMAND: node ${{ github.workspace }}/mate-hq/conformance/scripts/test-hq.ts
        run: vp exec node apps/web/test/scenarios/harness/hqPreflight.ts

      - name: Build the shared scenario bundle
        env:
          MATE_HQ_TEST_COMMAND: node ${{ github.workspace }}/mate-hq/conformance/scripts/test-hq.ts
        run: vp exec node apps/web/test/scenarios/harness/build.ts

      - name: Upload the content-addressed scenario bundle
        uses: actions/upload-artifact@v4
        with:
          name: state-smoke-scenario-bundle
          path: node_modules/.cache/mate-scenario-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  prepare:
    name: CI promotion
    needs: [selection, scenario_bundle, state_smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require selected work to succeed
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          BUNDLE_RESULT: ${{ needs.scenario_bundle.result }}
          SMOKE_RESULT: ${{ needs.state_smoke.result }}
          SKIP: ${{ needs.selection.outputs.skip }}
          SMOKE_SELECTED: ${{ contains(fromJSON(needs.selection.outputs.jobs || '[]'), 'state_smoke') }}
        run: |
          if [ "$SELECTION_RESULT" != success ]; then
            echo "::error::CI selection did not succeed ($SELECTION_RESULT)."
            exit 1
          fi
          if [ "$SKIP" != true ] && [ "$SMOKE_SELECTED" = true ] && [ "$BUNDLE_RESULT" != success ]; then
            echo "::error::The scenario bundle producer did not succeed ($BUNDLE_RESULT)."
            exit 1
          fi
          if [ "$SKIP" != true ] && [ "$SMOKE_SELECTED" = true ] && [ "$SMOKE_RESULT" != success ]; then
            echo "::error::State Smoke did not succeed ($SMOKE_RESULT)."
            exit 1
          fi

  cache:
    name: Check cache (${{ matrix.os }})
    needs: selection
    # A verified promotion runs no tests, yet writes each cache whose key main does not hold yet.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Record the resolved Node version
        id: node
        run: *node_version

      - name: Look up pnpm store
        id: store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.paths.outputs.store }}
          key: *pnpm_store_key
          lookup-only: true

      - name: Look up pnpm metadata
        if: runner.os == 'Linux'
        id: metadata
        uses: actions/cache/restore@v4
        with:
          # Cache metadata only; lockfile-verified.jsonl must never skip a later run's check.
          path: &pnpm_metadata_path ${{ runner.temp }}/pnpm-metadata/v11
          key: &pnpm_metadata_key pnpm-metadata-${{ runner.os }}-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          lookup-only: true

      - name: Look up the scenarios' Chrome for Testing
        if: runner.os == 'Linux'
        id: browser
        uses: actions/cache/restore@v4
        with:
          path: &test_browser_path ~/.cache/mate-test-browser
          key: &test_browser_key mate-test-browser-${{ runner.os }}-${{ hashFiles('apps/web/test/testBrowser.ts') }}
          lookup-only: true

      - name: Look up the hosted dependencies
        if: runner.os == 'Linux'
        id: hosted_modules
        uses: actions/cache/restore@v4
        with:
          path: *hosted_modules_path
          key: *hosted_modules_key
          lookup-only: true

      # A fresh main push always installs: the Linux install is main's lockfile policy check.
      - name: Restore pnpm store
        if: &builds needs.selection.outputs.skip != 'true' || steps.store.outputs.cache-hit != 'true' || (runner.os == 'Linux' && (steps.metadata.outputs.cache-hit != 'true' || steps.browser.outputs.cache-hit != 'true' || steps.hosted_modules.outputs.cache-hit != 'true'))
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Restore pnpm metadata
        if: &builds_on_linux runner.os == 'Linux' && (needs.selection.outputs.skip != 'true' || steps.store.outputs.cache-hit != 'true' || steps.metadata.outputs.cache-hit != 'true' || steps.browser.outputs.cache-hit != 'true' || steps.hosted_modules.outputs.cache-hit != 'true')
        uses: actions/cache/restore@v4
        with:
          path: *pnpm_metadata_path
          key: *pnpm_metadata_key
          restore-keys: |
            pnpm-metadata-${{ runner.os }}-pnpm11-

      - name: Install dependencies
        if: *builds
        # The Linux cache Check owns main's policy verification; macOS reuses that verdict.
        env:
          PNPM_CONFIG_FROZEN_LOCKFILE: "true"
          PNPM_CONFIG_CACHE_DIR: ${{ runner.temp }}/pnpm-metadata
          PNPM_CONFIG_TRUST_LOCKFILE: ${{ runner.os != 'Linux' }}
        run: &full_dependencies vp install --frozen-lockfile

      - name: Save pnpm store
        if: steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.paths.outputs.store }}
          key: ${{ steps.store.outputs.cache-primary-key }}

      - name: Save pnpm metadata
        if: runner.os == 'Linux' && steps.metadata.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *pnpm_metadata_path
          key: ${{ steps.metadata.outputs.cache-primary-key }}

      - name: Restore the scenarios' Chrome for Testing
        if: *builds_on_linux
        uses: actions/cache/restore@v4
        with:
          path: *test_browser_path
          key: *test_browser_key

      - name: Provision the scenarios' Chrome for Testing
        if: *builds_on_linux
        run: vp run test:browser

      - name: Save the scenarios' Chrome for Testing
        if: runner.os == 'Linux' && steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *test_browser_path
          key: ${{ steps.browser.outputs.cache-primary-key }}

      # The full install above verified the lockfile; the shards' hosted install replaces it.
      - name: Clear the full install
        if: &builds_hosted_modules runner.os == 'Linux' && steps.hosted_modules.outputs.cache-hit != 'true'
        env:
          HOSTED_MODULES: *hosted_modules_path
        run: for modules in $HOSTED_MODULES; do rm -rf "$modules"; done

      - name: Install the hosted dependencies
        if: *builds_hosted_modules
        env: *verified_lockfile
        run: *hosted_dependencies

      - name: Save the hosted dependencies
        if: *builds_hosted_modules
        uses: actions/cache/save@v4
        with:
          path: *hosted_modules_path
          key: ${{ steps.hosted_modules.outputs.cache-primary-key }}

      - name: Prune superseded main caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEYS: |
            ${{ steps.store.outputs.cache-primary-key }}
            ${{ steps.metadata.outputs.cache-primary-key }}
            ${{ steps.browser.outputs.cache-primary-key }}
            ${{ steps.hosted_modules.outputs.cache-primary-key }}
        run: |
          set -euo pipefail
          caches=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --paginate --slurp)
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            prefix="${key%-*}-"
            # Legacy ref-scoped copies would win a ref's fallback before main's newest store.
            # Cache save can fail softly. Never prune before its key exists on main.
            ids=$(jq -r --arg key "$key" --arg prefix "$prefix" '
              [.[] .actions_caches[] | select(.key | startswith($prefix))]
              | if any(.ref == "refs/heads/main" and .key == $key) then
                  (map(select(.ref == "refs/heads/main")) | sort_by(.created_at, .id) | last | .id) as $keep
                  | .[] | select(.id != $keep) | .id
                else empty end
            ' <<< "$caches")
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
            done <<< "$ids"
          done <<< "$CACHE_KEYS"

  check:
    name: Check
    needs: [selection, changes]
    if: ${{ !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'check') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Restore pnpm metadata
        uses: actions/cache/restore@v4
        with:
          # Cache metadata only; lockfile-verified.jsonl must never skip a later run's check.
          path: ${{ runner.temp }}/pnpm-metadata/v11
          key: pnpm-metadata-${{ runner.os }}-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-metadata-${{ runner.os }}-pnpm11-

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env:
          PNPM_CONFIG_FROZEN_LOCKFILE: "true"
          PNPM_CONFIG_CACHE_DIR: ${{ runner.temp }}/pnpm-metadata
          PNPM_CONFIG_TRUST_LOCKFILE: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: *full_dependencies

      - name: Check
        run: git ls-files -z -- . ':!:apps/desktop/**' ':!:apps/mobile/**' | xargs -0 vp check --no-error-on-unmatched-pattern

  check_guards:
    name: Check Guards
    needs: [selection, changes]
    if: ${{ !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'check_guards') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env:
          PNPM_CONFIG_FROZEN_LOCKFILE: "true"
          PNPM_CONFIG_TRUST_LOCKFILE: "true"
        run: *full_dependencies

      - name: Reject untracked package shells
        run: |
          test -z "$(git ls-files packages/ssh packages/tailscale)" &&
            test ! -d packages/ssh -a ! -d packages/tailscale || {
            printf '%s\n' 'packages/ssh and packages/tailscale were deleted at the freeze; a directory here means a workspace manifest or script still expects them.'
            exit 1
          }

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      # actionlint builds from the Go module proxy: GitHub release downloads fail intermittently.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Check workflow schema
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml

      - name: Check imported.lock
        run: node scripts/imported-lock.ts --check

      - name: Check showcase scenes
        run: node scripts/showcase-scenes.ts --check

      - name: Reconcile guard exceptions
        run: node scripts/check-guard-exceptions.ts

      - name: Check runtime cycle ratchet
        run: node scripts/check-runtime-cycles.ts

      - name: Check test sentence retention
        if: &manual_tests github.event_name == 'workflow_dispatch'
        run: node scripts/check-test-sentences.ts

      - name: Check scenario area caps
        if: *manual_tests
        run: node scripts/check-scenario-caps.ts

      - name: Check test clock reads
        if: *manual_tests
        run: node scripts/check-test-clock.ts

      - name: Check CSS motion
        run: node scripts/check-css-motion.ts

      - name: Check CSS theme tokens
        run: node scripts/check-css-tokens.ts

      - name: Check generated theme tokens
        run: node scripts/generate-theme-tokens.ts --check

  check_types:
    name: Check Types
    needs: [selection, changes]
    if: ${{ !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'check_types') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env:
          PNPM_CONFIG_FROZEN_LOCKFILE: "true"
          PNPM_CONFIG_TRUST_LOCKFILE: "true"
        run: *full_dependencies

      - name: Typecheck
        run: vpr typecheck

      - name: Typecheck scenarios
        run: vp exec effect-tsgo tsrs --noEmit --incremental -p apps/web/test/scenarios/tsconfig.json

  check_build:
    name: Check Build
    needs: [selection, changes]
    if: ${{ !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'check_build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env:
          PNPM_CONFIG_FROZEN_LOCKFILE: "true"
          PNPM_CONFIG_TRUST_LOCKFILE: "true"
        run: *full_dependencies

      - name: Build server bundle
        run: vp run --filter t3 build

      - name: Setup Rust
        if: needs.changes.outputs.resource_monitor != 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check resource monitor formatting
        if: needs.changes.outputs.resource_monitor != 'false'
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Test resource monitor
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.resource_monitor != 'false'
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  # The scenario producer builds the shared bundle once; sign-in, fixed smoke
  # and the shared graph's affected scenarios all block CI. They run against
  # the test HQ of zeropsio/mate-hq (private), read with a deploy key.
  # Shards use the selection and download the producer's content-addressed bundle.
  state_smoke:
    name: State Smoke ${{ matrix.shard }}
    needs: [selection, scenario_bundle]
    if: ${{ !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'state_smoke') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.state_smoke) }}
    env:
      # The bundle build reads it too: an external HQ changes the bundle's HQ origin.
      MATE_HQ_TEST_COMMAND: node ${{ github.workspace }}/mate-hq/conformance/scripts/test-hq.ts
      MATE_HQ_PREFLIGHT_SHA: ${{ needs.scenario_bundle.outputs.hq_ref }}
      MATE_SIGNAL_REPORT: state-smoke-reports/${{ matrix.shard }}.json
      MATE_CI_SELECTION: ${{ needs.selection.outputs.selection_manifest }}
    steps:
      - name: Require the scenario bundle producer to succeed
        env:
          BUNDLE_RESULT: ${{ needs.scenario_bundle.result }}
        run: |
          if [ "$BUNDLE_RESULT" != success ]; then
            echo "::error::The scenario bundle producer did not succeed ($BUNDLE_RESULT)."
            exit 1
          fi

      - name: Require the mate-hq deploy key
        env:
          MATE_HQ_DEPLOY_KEY: ${{ secrets.MATE_HQ_DEPLOY_KEY }}
        run: |
          if [ -z "$MATE_HQ_DEPLOY_KEY" ]; then
            echo "::error::Secret MATE_HQ_DEPLOY_KEY is absent (fork pull requests get no secrets). The state-only smoke needs the test HQ from zeropsio/mate-hq and fails without it."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ needs.scenario_bundle.outputs.node_version }}
          cache: false
          run-install: false

      - name: Resolve the mate-hq ref
        id: hq_ref
        run: |
          ref=$(node scripts/hq-ref.ts)
          echo "Testing against mate-hq $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout mate-hq
        uses: actions/checkout@v6
        with:
          repository: zeropsio/mate-hq
          ref: ${{ steps.hq_ref.outputs.ref }}
          ssh-key: ${{ secrets.MATE_HQ_DEPLOY_KEY }}
          path: mate-hq

      - name: Setup Go for mate-hq
        uses: actions/setup-go@v5
        with:
          go-version-file: mate-hq/go.mod
          cache: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Record the resolved Node version
        id: node
        run: *node_version

      - name: Restore the hosted dependencies
        id: hosted_modules
        uses: actions/cache/restore@v4
        with: *hosted_modules

      - name: Restore pnpm store
        if: steps.hosted_modules.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        if: steps.hosted_modules.outputs.cache-hit != 'true'
        env: *verified_lockfile
        run: *hosted_dependencies

      - name: Install mate-hq and its services
        working-directory: mate-hq/conformance
        env: *verified_lockfile
        run: |
          vp install --frozen-lockfile
          echo "MATE_HQ_REVISION=$(git -C .. rev-parse HEAD)" >> "$GITHUB_ENV"
          ../scripts/ci-install-object-store.sh
          ../scripts/ci-install-postgres.sh

      - name: Test environment source consumers
        if: matrix.shard == 1
        run: |
          vp exec effect-tsgo tsrs -p apps/web/test/e-env/tsconfig.json
          vp -C apps/web test run --config test/e-env/vitest.config.ts

      - name: Cache the scenarios' Chrome for Testing
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mate-test-browser
          key: mate-test-browser-${{ runner.os }}-${{ hashFiles('apps/web/test/testBrowser.ts') }}

      - name: Download the shared scenario bundle
        uses: actions/download-artifact@v4
        with:
          name: state-smoke-scenario-bundle
          path: node_modules/.cache/mate-scenario-web

      - name: Certify sign-in, fixed smoke and affected scenarios
        timeout-minutes: 11
        env:
          MATE_SCENARIO_REQUIRE_BUNDLE: "1"
          MATE_STATE_SMOKE_SELECTION: ${{ needs.selection.outputs.state_smoke_selection }}
        run: |
          vp run test:browser
          timeout --signal=TERM --kill-after=10s 10m node scripts/state-smoke.ts --selection "$MATE_STATE_SMOKE_SELECTION" --shard ${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload shard evidence
        if: ${{ always() && hashFiles('state-smoke-reports/*.progress.jsonl') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: state-smoke-shard-${{ matrix.shard }}
          path: state-smoke-reports/
          if-no-files-found: error
          retention-days: 30

  # Independent suites run concurrently; the existing Test context reports
  # their combined verdict without serializing package execution.
  test:
    name: Test
    needs: [selection, test_packages, test_scripts, test_client_runtime]
    if: ${{ !cancelled() && needs.selection.result == 'success' && contains(fromJSON(needs.selection.outputs.jobs), 'test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report verified promotion
        if: needs.selection.outputs.skip == 'true'
        run: echo 'This tree passed full CI on kh-next or main.'

      - name: Require every package test job to pass
        if: needs.selection.outputs.skip != 'true'
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.selection.outputs.blame == 'true' || !contains(needs.*.result, 'skipped')) }}" = true

  test_packages:
    name: Test Packages
    needs: [selection, changes]
    if: ${{ !cancelled() && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'test_packages') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env: *verified_lockfile
        run: *full_dependencies

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/web' --filter '!@t3tools/mobile' --filter '!@t3tools/monorepo' --filter '!@t3tools/scripts' --filter '!@t3tools/client-runtime' test

      - name: Test scenario drivers
        run: |
          vp run test:browser
          vp -C apps/web test run --config test/scenarios/vitest.config.ts --project scenario-drivers --allowOnly=false

      # Reuse Packages' Electron install for the complete Linux runtime smoke.
      - name: Build desktop pipeline
        if: needs.changes.outputs.native_clients != 'false'
        env:
          VITE_HTTP_URL: ""
          VITE_WS_URL: ""
        run: |
          VITE_HOSTED_APP_CHANNEL="$(node --input-type=module -e 'import { resolveDesktopUpdateChannel } from "./scripts/stage-desktop-web.ts"; import pkg from "./apps/server/package.json" with { type: "json" }; process.stdout.write(resolveDesktopUpdateChannel(pkg.version));')"
          export VITE_HOSTED_APP_CHANNEL
          vp run build:desktop

      - name: Verify preload bundle output
        if: needs.changes.outputs.native_clients != 'false'
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Stage desktop web bundle
        if: needs.changes.outputs.native_clients != 'false'
        run: node scripts/stage-desktop-web.ts --skip-build

      - name: Diagnose Linux Electron runtime
        if: needs.changes.outputs.native_clients != 'false'
        continue-on-error: true
        run: |
          electron_binary="$(cd apps/desktop && node -e 'process.stdout.write(require("electron"))')"
          ldd "$electron_binary" | grep "not found" || true
          xvfb-run -a -s "-screen 0 1440x900x24" "$electron_binary" --version

      - name: Smoke test desktop
        if: needs.changes.outputs.native_clients != 'false'
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" vp run --filter @t3tools/desktop smoke-test 2>&1 |
            tee "${{ runner.temp }}/desktop-smoke-log.txt"

      - name: Upload desktop smoke capture
        if: always() && needs.changes.outputs.native_clients != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-capture
          path: |
            ${{ runner.temp }}/desktop-smoke-*/smoke.png
            ${{ runner.temp }}/desktop-smoke-log.txt
          if-no-files-found: warn
          retention-days: 7

  test_scripts:
    name: Test Scripts ${{ matrix.shard }}
    needs: selection
    if: ${{ !cancelled() && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'test_scripts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.test_scripts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env: *verified_lockfile
        run: &cross_client_dependencies vp install --frozen-lockfile --filter='!@t3tools/desktop'

      - name: Test
        run: vp run --filter @t3tools/scripts test --shard ${{ matrix.shard }}/${{ matrix.total }}

  # client-runtime alone outran every other package in Test Packages and set that job's length.
  test_client_runtime:
    name: Test Client Runtime ${{ matrix.shard }}
    needs: selection
    if: ${{ !cancelled() && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'test_client_runtime') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.test_client_runtime) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env: *verified_lockfile
        run: *hosted_dependencies

      - name: Test
        run: vp run --filter @t3tools/client-runtime test --shard ${{ matrix.shard }}/${{ matrix.total }}

  # apps/web alone ran ~8.5 min inside Test and set the length of every CI run.
  # Its files run in parallel workers, so each added runner divides it.
  test_web:
    name: Test Web ${{ matrix.shard }}
    needs: selection
    if: ${{ !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'test_web') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.test_web) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env: *verified_lockfile
        run: *hosted_dependencies

      - name: Test
        run: vp run --filter @t3tools/web test --shard ${{ matrix.shard }}/${{ matrix.total }}

  # apps/server sets `fileParallelism: false`, so its files run strictly one at
  # a time. Sharding spreads them over separate runners instead of separate
  # workers, so no two server test files ever share a machine and the isolation
  # that flag buys is preserved exactly. The existing sequencer assigns whole
  # files by observed duration (scripts/lib/spread-shard.ts), longest first.
  test_server:
    name: Test Server ${{ matrix.shard }}
    needs: selection
    if: ${{ !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'test_server') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.test_server) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env: *verified_lockfile
        run: *cross_client_dependencies

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          # Apply certification to the existing A/E/F inventory. The rest of the
          # server suite includes platform-specific skips and still runs in full.
          MATE_CHAT_GATE_SERVER: "1"
        run: >-
          vp run --filter t3 test --shard ${{ matrix.shard }}/${{ matrix.total }}
          --allowOnly=false --reporter=default --reporter=../../scripts/chat-gate-reporter.ts

      - name: Certify engine oracles
        if: matrix.shard == 1
        run: |
          vp exec effect-tsgo tsrs --noEmit --incremental -p apps/web/test/engine-oracle/tsconfig.json
          vp -C apps/web test run --project engine-oracle test/engine-oracle/runCard.oracle.test.ts test/engine-oracle/mateHealth.oracle.test.ts --allowOnly=false --reporter=default --reporter=../../scripts/chat-gate-reporter.ts

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces it. Published straight to the run's step summary — gated on
      # presence since only one shard writes it.
      - name: Detect transfer budget report
        id: transfer_budget
        if: (always())
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: (always() && steps.transfer_budget.outputs.present == 'true')
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  # PRs select the scenario bundle and resource monitor by their inputs. Pushes
  # run both; an unresolved diff fails open to keep their coverage complete.
  changes:
    name: Changes
    needs: selection
    if: ${{ !cancelled() && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'changes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    outputs:
      chat: ${{ steps.detect.outputs.chat }}
      resource_monitor: ${{ steps.detect.outputs.resource_monitor }}
      native_clients: ${{ steps.detect.outputs.native_clients }}
    steps:
      - name: Checkout workspace manifest
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /package.json
            /apps/mobile/package.json
            /apps/desktop/package.json
            /packages/*/package.json
            /scripts/ci-blame.ts
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Detect changed areas
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          MATE_CI_SELECTION: ${{ needs.selection.outputs.selection_manifest }}
        run: |
          set -uo pipefail

          areas=(chat resource_monitor native_clients)

          fail_open() {
            echo "$* Running every gated job."
            for area in "${areas[@]}"; do echo "${area}=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes an input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")
          printf '%s\n' "$paths" | node scripts/ci-blame.ts --areas \
            || fail_open "Could not resolve CI selection or native client dependencies."

  # Keep the required Release Smoke context; its commands run in Check Build's installed workspace.
  release_smoke:
    name: Release Smoke
    needs:
      [
        selection,
        check,
        check_guards,
        check_types,
        check_build,
        test_mobile,
        mobile_native_static_analysis,
      ]
    if: ${{ !cancelled() && needs.selection.result == 'success' && contains(fromJSON(needs.selection.outputs.jobs), 'release_smoke') }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report verified promotion
        if: needs.selection.outputs.skip == 'true'
        run: echo 'This tree passed full CI on kh-next or main.'

      - name: Require release smoke to pass
        if: needs.selection.outputs.skip != 'true'
        run: |
          for result in "${{ needs.check.result }}" "${{ needs.check_guards.result }}" "${{ needs.check_types.result }}" "${{ needs.check_build.result }}"; do
            test "$result" = success || exit 1
          done
          for result in "${{ needs.test_mobile.result }}" "${{ needs.mobile_native_static_analysis.result }}"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

  test_mobile:
    name: Test Mobile
    needs: [selection, changes]
    if: ${{ !cancelled() && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'test_mobile') && needs.changes.outputs.native_clients != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env: *verified_lockfile
        run: *full_dependencies

      - name: Test
        run: vp run --filter @t3tools/mobile test

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: [selection, changes]
    if: ${{ !cancelled() && needs.selection.outputs.skip != 'true' && contains(fromJSON(needs.selection.outputs.jobs), 'mobile_native_static_analysis') && needs.changes.outputs.native_clients != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: *store_path

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with: *pnpm_store

      - name: Install dependencies
        env: *verified_lockfile
        run: vp install --frozen-lockfile --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile
