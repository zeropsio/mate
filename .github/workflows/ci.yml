name: CI
run-name: CI · ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
      - kh-next
      - "kh-bisect/**"

permissions:
  contents: read

# Includes setup-vp's internal post-action cache: only the main writer overrides this.
cache-mode: read

env:
  PNPM_CONFIG_CACHE_DIR: ${{ runner.temp }}/pnpm-metadata
  PNPM_CONFIG_FETCH_RETRIES: "2"
  PNPM_CONFIG_FETCH_TIMEOUT: "60000"
  PNPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  PNPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: CI promotion
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.verdict.outputs.skip }}
    steps:
      - name: Check kh-next verification
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            verified=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" --paginate --jq '
              .workflow_runs[]
              | select(.head_sha == env.GITHUB_SHA)
              | select(.head_branch == "kh-next")
              | select(.event == "push" and .status == "completed" and .conclusion == "success")
              | .id')
            if [[ -n "$verified" ]]; then skip=true; fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "Already verified on kh-next: ${skip}"

  # Promotion can skip verification jobs, but must publish the stores for its new lockfile.
  cache:
    name: Check cache (${{ matrix.os }})
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    cache-mode: write
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: |
          echo "store=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.paths.outputs.store }}
          key: vite-plus-${{ runner.os }}-${{ steps.paths.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vite-plus-${{ runner.os }}-${{ steps.paths.outputs.arch }}-pnpm-

      - name: Restore pnpm metadata
        if: runner.os == 'Linux'
        id: metadata
        uses: actions/cache/restore@v4
        with:
          # Cache metadata only; lockfile-verified.jsonl must never skip a later run's check.
          path: ${{ runner.temp }}/pnpm-metadata/v11
          key: pnpm-metadata-${{ runner.os }}-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-metadata-${{ runner.os }}-pnpm11-

      - name: Install dependencies
        # The Linux cache Check owns main's policy verification; macOS reuses that verdict.
        env:
          PNPM_CONFIG_FROZEN_LOCKFILE: "true"
          PNPM_CONFIG_TRUST_LOCKFILE: ${{ runner.os != 'Linux' }}
        run: vp install --frozen-lockfile

      - name: Save pnpm store
        if: steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.paths.outputs.store }}
          key: ${{ steps.store.outputs.cache-primary-key }}

      - name: Save pnpm metadata
        if: runner.os == 'Linux' && steps.metadata.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          # Cache metadata only; lockfile-verified.jsonl must never skip a later run's check.
          path: ${{ runner.temp }}/pnpm-metadata/v11
          key: ${{ steps.metadata.outputs.cache-primary-key }}

      - name: Restore the scenarios' Chrome for Testing
        if: runner.os == 'Linux'
        id: browser
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mate-test-browser
          key: mate-test-browser-${{ runner.os }}-${{ hashFiles('apps/web/test/testBrowser.ts') }}

      - name: Provision the scenarios' Chrome for Testing
        if: runner.os == 'Linux'
        run: vp run test:browser

      - name: Save the scenarios' Chrome for Testing
        if: runner.os == 'Linux' && steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/mate-test-browser
          key: ${{ steps.browser.outputs.cache-primary-key }}

      - name: Prune superseded main caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEYS: |
            ${{ steps.store.outputs.cache-primary-key }}
            ${{ steps.metadata.outputs.cache-primary-key }}
            ${{ steps.browser.outputs.cache-primary-key }}
        run: |
          set -euo pipefail
          caches=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --paginate --slurp)
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            prefix="${key%-*}-"
            # Legacy ref-scoped copies would win a ref's fallback before main's newest store.
            # Cache save can fail softly. Never prune before its key exists on main.
            ids=$(jq -r --arg key "$key" --arg prefix "$prefix" '
              [.[] .actions_caches[] | select(.key | startswith($prefix))]
              | if any(.ref == "refs/heads/main" and .key == $key) then
                  (map(select(.ref == "refs/heads/main")) | sort_by(.created_at, .id) | last | .id) as $keep
                  | .[] | select(.id != $keep) | .id
                else empty end
            ' <<< "$caches")
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
            done <<< "$ids"
          done <<< "$CACHE_KEYS"

  check:
    name: Check
    needs: [prepare, changes]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report verified promotion
        if: needs.prepare.outputs.skip == 'true'
        run: echo 'This SHA passed full CI on kh-next.'

      - name: Checkout
        if: needs.prepare.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject untracked package shells
        if: needs.prepare.outputs.skip != 'true'
        run: |
          test -z "$(git ls-files packages/ssh packages/tailscale)" &&
            test ! -d packages/ssh -a ! -d packages/tailscale || {
            printf '%s\n' 'packages/ssh and packages/tailscale were deleted at the freeze; a directory here means a workspace manifest or script still expects them.'
            exit 1
          }

      - name: Reject repository-owned PR assets
        if: needs.prepare.outputs.skip != 'true'
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Restore pnpm metadata
        if: needs.prepare.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          # Cache metadata only; lockfile-verified.jsonl must never skip a later run's check.
          path: ${{ runner.temp }}/pnpm-metadata/v11
          key: pnpm-metadata-${{ runner.os }}-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-metadata-${{ runner.os }}-pnpm11-

      - name: Setup Vite+
        if: needs.prepare.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1
        # Check owns non-main verification; main has exactly one verifier in Check cache.
        env:
          PNPM_CONFIG_FROZEN_LOCKFILE: "true"
          PNPM_CONFIG_TRUST_LOCKFILE: ${{ github.ref == 'refs/heads/main' }}
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check imported.lock
        if: needs.prepare.outputs.skip != 'true'
        run: node scripts/imported-lock.ts --check

      - name: Check showcase scenes
        if: needs.prepare.outputs.skip != 'true'
        run: node scripts/showcase-scenes.ts --check

      # One AST scan reconciles every ledger and checks the identity ratchets.
      - name: Reconcile guard exceptions
        if: needs.prepare.outputs.skip != 'true'
        run: node scripts/check-guard-exceptions.ts

      - name: Check runtime cycle ratchet
        if: needs.prepare.outputs.skip != 'true'
        run: node scripts/check-runtime-cycles.ts

      - name: Check test sentence retention
        if: needs.prepare.outputs.skip != 'true'
        run: node scripts/check-test-sentences.ts

      - name: Check CSS motion
        if: needs.prepare.outputs.skip != 'true'
        run: node scripts/check-css-motion.ts

      - name: Check CSS theme tokens
        if: needs.prepare.outputs.skip != 'true'
        run: node scripts/check-css-tokens.ts

      - name: Check generated theme tokens
        if: needs.prepare.outputs.skip != 'true'
        run: node scripts/generate-theme-tokens.ts --check

      - name: Check
        if: needs.prepare.outputs.skip != 'true'
        run: git ls-files -z -- . ':!:apps/desktop/**' ':!:apps/mobile/**' | xargs -0 vp check --no-error-on-unmatched-pattern

      - name: Typecheck
        if: needs.prepare.outputs.skip != 'true'
        run: vpr typecheck

      - name: Typecheck scenarios
        if: needs.prepare.outputs.skip != 'true'
        run: vp exec tsc --noEmit --incremental -p apps/web/test/scenarios/tsconfig.json

      # `t3#build` depends on `@t3tools/web#build`: the production web and server
      # bundles, built on every run.
      - name: Build server bundle
        if: needs.prepare.outputs.skip != 'true'
        run: vp run --filter t3 build

      # Reuse Check's Ubuntu checkout/install; retain individually named failure steps.
      - name: Setup Rust
        if: needs.prepare.outputs.skip != 'true' && needs.changes.outputs.resource_monitor != 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check resource monitor formatting
        if: needs.prepare.outputs.skip != 'true' && needs.changes.outputs.resource_monitor != 'false'
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Test resource monitor
        if: needs.prepare.outputs.skip != 'true' && needs.changes.outputs.resource_monitor != 'false'
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Exercise release-only workflow steps
        if: needs.prepare.outputs.skip != 'true'
        run: node scripts/release-smoke.ts

  # Every job gated on the `changes` outputs below runs unless the gate said
  # an explicit "false": a gate that failed leaves the output empty, and that
  # must run the job rather than silently skip it. `!cancelled()` keeps a
  # failed gate from skipping its dependents outright.
  chat_bundle:
    name: Chat Contract bundle
    needs: [prepare, changes]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.skip == 'true' || github.event_name == 'push' || needs.changes.outputs.chat != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report verified promotion
        if: needs.prepare.outputs.skip == 'true'
        run: echo 'This SHA passed full CI on kh-next.'

      - name: Checkout
        if: needs.prepare.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        if: needs.prepare.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1
        # Consumers trust Check's frozen lockfile only during installation.
        # https://pnpm.io/settings/dependency-resolution#trustlockfile
        env: &verified_lockfile
          PNPM_CONFIG_FROZEN_LOCKFILE: "true"
          PNPM_CONFIG_TRUST_LOCKFILE: "true"
        with:
          node-version-file: package.json
          cache: true
          run-install: &hosted_dependencies |
            args:
              - --filter=!@t3tools/mobile
              - --filter=!@t3tools/desktop

      - name: Build the shared scenario bundle
        if: needs.prepare.outputs.skip != 'true'
        run: vp exec node apps/web/test/scenarios/harness/build.ts

      - name: Upload the content-addressed scenario bundle
        if: needs.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chat-scenario-bundle
          path: node_modules/.cache/mate-scenario-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  chat_scenarios:
    name: Test Web Scenarios (${{ matrix.name }})
    needs: [prepare, chat_bundle]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.chat_bundle.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Measured C file durations are assigned in scripts/chat-gate.ts. The largest
        # suite gets its own runner; non-C uses Vitest's complete native inventory.
        include:
          - name: C shard 1
            command: node scripts/chat-gate.ts --verbose --stages C --shard 1/4
          - name: C shard 2
            command: node scripts/chat-gate.ts --verbose --stages C --shard 2/4
          - name: C shard 3
            command: node scripts/chat-gate.ts --verbose --stages C --shard 3/4
          - name: C shard 4
            command: node scripts/chat-gate.ts --verbose --stages C --shard 4/4
          - name: non-C shard 1
            command: >-
              vp -C apps/web test run --config test/scenarios/vitest.config.ts
              --project scenarios test/scenarios/areas
              --exclude 'test/scenarios/areas/c-mate/**' --shard 1/3 --allowOnly=false
              --reporter=default --reporter=../../scripts/chat-gate-reporter.ts
          - name: non-C shard 2
            command: >-
              vp -C apps/web test run --config test/scenarios/vitest.config.ts
              --project scenarios test/scenarios/areas
              --exclude 'test/scenarios/areas/c-mate/**' --shard 2/3 --allowOnly=false
              --reporter=default --reporter=../../scripts/chat-gate-reporter.ts
          - name: non-C shard 3
            command: >-
              vp -C apps/web test run --config test/scenarios/vitest.config.ts
              --project scenarios test/scenarios/areas
              --exclude 'test/scenarios/areas/c-mate/**' --shard 3/3 --allowOnly=false
              --reporter=default --reporter=../../scripts/chat-gate-reporter.ts
    steps:
      - name: Report verified promotion
        if: needs.prepare.outputs.skip == 'true'
        run: echo 'This SHA passed full CI on kh-next.'

      - name: Checkout
        if: needs.prepare.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        if: needs.prepare.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1
        env: *verified_lockfile
        with:
          node-version-file: package.json
          cache: true
          run-install: *hosted_dependencies

      - name: Cache the scenarios' Chrome for Testing
        if: needs.prepare.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mate-test-browser
          key: mate-test-browser-${{ runner.os }}-${{ hashFiles('apps/web/test/testBrowser.ts') }}

      - name: Download the shared scenario bundle
        if: needs.prepare.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: chat-scenario-bundle
          path: node_modules/.cache/mate-scenario-web

      - name: Certify every case in this shard
        if: needs.prepare.outputs.skip != 'true'
        env:
          MATE_SCENARIO_REQUIRE_BUNDLE: "1"
        run: ${{ matrix.command }}

  # Independent suites run concurrently; the existing Test context reports
  # their combined verdict without serializing package execution.
  test:
    name: Test
    needs: [prepare, test_packages, test_scripts, test_hq]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report verified promotion
        if: needs.prepare.outputs.skip == 'true'
        run: echo 'This SHA passed full CI on kh-next.'

      - name: Require every package test job to pass
        if: needs.prepare.outputs.skip != 'true'
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true

  test_packages:
    name: Test Packages
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        env: *verified_lockfile
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/web' --filter '!@t3tools/mobile' --filter '!@t3tools/monorepo' --filter '!@t3tools/scripts' --filter '!@t3tools/hq' test

      - name: Test scenario drivers
        run: |
          vp run test:browser
          vp -C apps/web test run --config test/scenarios/vitest.config.ts --project scenario-drivers --allowOnly=false

      # Reuse Packages' Electron install for the complete Linux runtime smoke.
      - name: Build desktop pipeline
        env:
          VITE_HTTP_URL: ""
          VITE_WS_URL: ""
        run: |
          VITE_HOSTED_APP_CHANNEL="$(node --input-type=module -e 'import { resolveDesktopUpdateChannel } from "./scripts/stage-desktop-web.ts"; import pkg from "./apps/server/package.json" with { type: "json" }; process.stdout.write(resolveDesktopUpdateChannel(pkg.version));')"
          export VITE_HOSTED_APP_CHANNEL
          vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Stage desktop web bundle
        run: node scripts/stage-desktop-web.ts --skip-build

      - name: Diagnose Linux Electron runtime
        continue-on-error: true
        run: |
          electron_binary="$(cd apps/desktop && node -e 'process.stdout.write(require("electron"))')"
          ldd "$electron_binary" | grep "not found" || true
          xvfb-run -a -s "-screen 0 1440x900x24" "$electron_binary" --version

      - name: Smoke test desktop
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" vp run --filter @t3tools/desktop smoke-test 2>&1 |
            tee "${{ runner.temp }}/desktop-smoke-log.txt"

      - name: Upload desktop smoke capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-capture
          path: |
            ${{ runner.temp }}/desktop-smoke-*/smoke.png
            ${{ runner.temp }}/desktop-smoke-log.txt
          if-no-files-found: warn
          retention-days: 7

  test_scripts:
    name: Test Scripts ${{ matrix.shard }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        env: *verified_lockfile
        with:
          node-version-file: package.json
          cache: true
          run-install: &cross_client_dependencies |
            args:
              - --filter=!@t3tools/desktop

      - name: Test
        run: vp run --filter @t3tools/scripts test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  test_hq:
    name: Test HQ ${{ matrix.shard }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        env: *verified_lockfile
        with:
          node-version-file: package.json
          cache: true
          run-install: *hosted_dependencies

      - name: Test
        run: vp run --filter @t3tools/hq test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # apps/web alone ran ~8.5 min inside Test and set the length of every CI run.
  # Its 669 files run in parallel workers, so two runners halve it.
  test_web:
    name: Test Web ${{ matrix.shard }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Report verified promotion
        if: needs.prepare.outputs.skip == 'true'
        run: echo 'This SHA passed full CI on kh-next.'

      - name: Checkout
        if: needs.prepare.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        if: needs.prepare.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1
        env: *verified_lockfile
        with:
          node-version-file: package.json
          cache: true
          run-install: *hosted_dependencies

      - name: Test
        if: needs.prepare.outputs.skip != 'true'
        run: vp run --filter @t3tools/web test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # apps/server sets `fileParallelism: false`, so its files run strictly one at
  # a time. Sharding spreads them over separate runners instead of separate
  # workers, so no two server test files ever share a machine and the isolation
  # that flag buys is preserved exactly. The existing sequencer assigns whole
  # files by observed duration (scripts/lib/spread-shard.ts), longest first.
  test_server:
    name: Test Server ${{ matrix.shard }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Report verified promotion
        if: needs.prepare.outputs.skip == 'true'
        run: echo 'This SHA passed full CI on kh-next.'

      - name: Checkout
        if: needs.prepare.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        if: needs.prepare.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1
        env: *verified_lockfile
        with:
          node-version-file: package.json
          cache: true
          run-install: *cross_client_dependencies

      - name: Test
        if: needs.prepare.outputs.skip != 'true'
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          # Apply certification to the existing A/E/F inventory. The rest of the
          # server suite includes platform-specific skips and still runs in full.
          MATE_CHAT_GATE_SERVER: "1"
        run: >-
          vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --allowOnly=false --reporter=default --reporter=../../scripts/chat-gate-reporter.ts

      - name: Certify engine oracles
        if: needs.prepare.outputs.skip != 'true' && matrix.shard == 1
        run: |
          vp exec tsc --noEmit --incremental -p apps/web/test/engine-oracle/tsconfig.json
          vp -C apps/web test run --project engine-oracle test/engine-oracle/runCard.oracle.test.ts test/engine-oracle/mateHealth.oracle.test.ts --allowOnly=false --reporter=default --reporter=../../scripts/chat-gate-reporter.ts

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces it. Published straight to the run's step summary — gated on
      # presence since only one shard writes it.
      - name: Detect transfer budget report
        id: transfer_budget
        if: needs.prepare.outputs.skip != 'true' && (always())
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: needs.prepare.outputs.skip != 'true' && (always() && steps.transfer_budget.outputs.present == 'true')
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  # PRs select the scenario bundle and resource monitor by their inputs. Pushes
  # run both; an unresolved diff fails open to keep their coverage complete.
  changes:
    name: Changes
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      chat: ${{ steps.detect.outputs.chat }}
      resource_monitor: ${{ steps.detect.outputs.resource_monitor }}
    steps:
      - name: Checkout workspace manifest
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Detect changed areas
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          areas=(chat resource_monitor)

          fail_open() {
            echo "$* Running every gated job."
            for area in "${areas[@]}"; do echo "${area}=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes an input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          gate() {
            local area="$1" pattern="$2"
            if grep -qE "$pattern" <<< "$paths"; then
              echo "${area}: changed"
              grep -m 20 -E "$pattern" <<< "$paths" | sed 's/^/  /'
              echo "${area}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${area}: unchanged"
              echo "${area}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # What every client builds on: the workspace manifests and toolchain
          # config, this workflow, and the packages the clients import. The
          # clients never import apps/server; they meet it over the contracts.
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|vite\.config\.ts|\.github/workflows/ci\.yml)$|^packages/(contracts|shared|client-runtime)/'

          # The bundle feeds every scenario area, all of which run real HQ Core.
          gate chat "${shared}|^apps/(hq|server|web)/|^packages/(effect-codex-app-server|effect-acp)/|^scripts/(chat-gate|gate-changed|test-postgres)"

          if [[ -n "${PR_NUMBER}" ]]; then
            gate resource_monitor '^native/resource-monitor/|^\.github/workflows/ci\.yml$'
          else
            echo "Push: resource monitor runs in full."
            echo "resource_monitor=true" >> "$GITHUB_OUTPUT"
          fi

  # Keep the required Release Smoke context; its commands run in Check's installed workspace.
  release_smoke:
    name: Release Smoke
    needs: [prepare, check]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report verified promotion
        if: needs.prepare.outputs.skip == 'true'
        run: echo 'This SHA passed full CI on kh-next.'

      - name: Require release smoke to pass
        if: needs.prepare.outputs.skip != 'true'
        run: test "${{ needs.check.result }}" = success

  test_mobile:
    name: Test Mobile
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        env: *verified_lockfile
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter @t3tools/mobile test

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        env: *verified_lockfile
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile
