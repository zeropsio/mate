name: Release mate bundle

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to bake into the rehearsal bundle
        required: true
        default: 0.0.0-rehearsal
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Resolve bundle version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node -p "require('./apps/server/package.json').version")"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$package_version" != "$tag_version" ]]; then
              echo "Release tag version '$tag_version' does not match apps/server/package.json version '$package_version' (tag '$GITHUB_REF_NAME')." >&2
              echo "Bump apps/server/package.json before creating the release tag." >&2
              exit 1
            fi
            version="$package_version"
          else
            version="$DISPATCH_VERSION"
            echo "Rehearsal version '$version' deliberately overrides apps/server/package.json version '$package_version'; mate --version will report 'mate v$package_version'."
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid SemVer: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The desktop matrix job below packages apps/desktop under this same
      # tag's version. Catch drift here, before any packaging runner spins up.
      - name: Check desktop package version
        run: |
          server_version="$(node -p "require('./apps/server/package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$desktop_version" != "$server_version" ]]; then
            echo "apps/desktop/package.json version '$desktop_version' does not match apps/server/package.json version '$server_version'." >&2
            echo "Keep both versions equal before tagging a release." >&2
            exit 1
          fi

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # /mate is deliberately baked in: it is the only supported Zerops mount,
      # and Vite's client base path cannot be supplied by the server at runtime.
      - name: Build web client
        env:
          VITE_BASE_PATH: /mate
        run: vp run --filter @t3tools/web build

      - name: Build server bundle
        run: node apps/server/scripts/cli.ts build

      - name: Pack bundle
        id: pack
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_dir="${RUNNER_TEMP}/release-assets"
          mkdir -p "$release_dir"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node apps/server/scripts/cli.ts pack --out "$release_dir"
          else
            node apps/server/scripts/cli.ts pack --out "$release_dir" --app-version "$APP_VERSION"
          fi

          mapfile -d '' tarballs < <(find "$release_dir" -maxdepth 1 -type f -name '*.tgz' -print0)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected pack to write exactly one tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi

          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"
          echo "tarball_name=$(basename "${tarballs[0]}")" >> "$GITHUB_OUTPUT"
          ls -lh "${tarballs[0]}"

      - name: Verify tarball installation
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
        run: |
          install_prefix="$(mktemp -d "${RUNNER_TEMP}/mate-install.XXXXXX")"
          cp "$TARBALL" "$install_prefix/$TARBALL_NAME"
          cd "$install_prefix"
          npm init -y
          npm install "./$TARBALL_NAME"

          installed_version="$(./node_modules/.bin/mate --version)"
          echo "Installed binary version: $installed_version"

          # The manifest declares only the native addons the bundle still loads
          # from disk; everything else is inlined. `--version` proves the static
          # import graph resolves — these prove the addons themselves open, which
          # is the failure the prune could otherwise hide until a container boots.
          node --input-type=commonjs -e '
            const pty = require("node-pty");
            if (typeof pty.spawn !== "function") throw new Error("node-pty did not load");
            if (typeof require("msgpackr-extract").extractStrings !== "function") {
              throw new Error("msgpackr-extract did not load");
            }
            console.log("native addons loaded");
          '

      - name: Write checksum
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          release_dir="$(dirname "$TARBALL")"
          tarball_name="$(basename "$TARBALL")"
          cd "$release_dir"
          sha256sum "$tarball_name" > SHA256SUMS
          cat SHA256SUMS

      - name: Stage verified release assets
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mate-release-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  build_desktop:
    name: Build desktop (${{ matrix.platform }}/${{ matrix.arch }})
    # Runs on a rehearsal dispatch too, deliberately. Two things in this job
    # had never run in this repository's CI — setup-vp on Windows and the Rust
    # build of native/resource-monitor — and a rehearsal that skipped them
    # would rehearse only the half that already works. The third, the Linux
    # icon step's ImageMagick, ran for the first time on v0.2.2 and failed:
    # the runner image does not carry it, hence the install step below.
    # Publishing stays push-only, so a dispatch leaves the artifacts as
    # workflow artifacts and touches no release.
    needs: build
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            target: dmg
            runs-on: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: mac
            arch: x64
            target: dmg
            runs-on: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: win
            arch: x64
            target: nsis
            runs-on: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - platform: linux
            arch: x64
            target: AppImage
            runs-on: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
    # Unset until the repository secrets exist. build-desktop-artifact.ts
    # scrubs empty CSC_*/APPLE_* values itself; the Azure vars are read only
    # when --signed is passed, which "Resolve signing" below gates on these
    # same secrets — so adding the secrets is enough to turn signing on.
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # build-desktop-artifact.ts resizes the 1024px source icon into the nine
      # sizes a Linux desktop entry needs, shelling out to `magick` and falling
      # back to `convert`. The GitHub Ubuntu runner image carries neither, so
      # the first tagged build that packaged Linux failed on `spawn magick
      # ENOENT`. Only this leg resizes anything; mac takes an .icns and Windows
      # an .ico straight from assets/prod.
      #
      # Ubuntu's `imagemagick` is still ImageMagick 6, which installs `convert`
      # but NOT `magick` — that entry point arrived in ImageMagick 7. The
      # script's fallback is what actually runs here, so this check asserts the
      # contract it depends on (either tool present) rather than one binary.
      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          if command -v magick >/dev/null 2>&1; then
            magick -version | head -1
          elif command -v convert >/dev/null 2>&1; then
            convert -version | head -1
          else
            echo "Neither magick nor convert is on PATH after installing imagemagick." >&2
            exit 1
          fi

      # native/resource-monitor is staged into every desktop build by
      # build-desktop-artifact.ts, which shells out to `cargo build --target
      # <rust_target>` per platform/arch (see resolveResourceMonitorRustTargets).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Resolve signing
        id: signing
        run: |
          signed=false
          if [[ "${{ matrix.platform }}" == "mac" && -n "$CSC_LINK" ]]; then
            signed=true
          fi
          if [[ "${{ matrix.platform }}" == "win" && -n "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" ]]; then
            signed=true
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Build desktop artifact
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.build.outputs.version }}"
            --output-dir "${{ runner.temp }}/desktop-dist"
          )
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            args+=(--signed)
          fi
          node scripts/build-desktop-artifact.ts "${args[@]}"

      # Uploads the whole output dir as-is: installer, zip (mac), .blockmap,
      # and the latest*.yml updater feed files electron-builder writes
      # alongside it. The release job merges/flattens these per-leg uploads.
      - name: Stage desktop release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/desktop-dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [build, build_desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Needed to run scripts/merge-update-manifests.ts below.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: mate-release-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Verify downloaded release assets
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-assets

      # electron-builder never arch-suffixes the mac updater manifest, so the
      # arm64 and x64 legs each wrote their own same-named latest-mac.yml with
      # only their own arch's entry. Merge them into one multi-arch manifest,
      # or auto-update on one arch silently sees no updates.
      - name: Merge macOS updater manifest
        run: |
          node scripts/merge-update-manifests.ts --platform mac \
            desktop-assets/desktop-mac-arm64/latest-mac.yml \
            desktop-assets/desktop-mac-x64/latest-mac.yml
          rm -f desktop-assets/desktop-mac-x64/latest-mac.yml

      # Windows and Linux are single-arch, so their per-leg files need no
      # merging; every remaining filename should be unique (electron-builder's
      # artifactName template embeds ${arch}, the merged mac manifest is the
      # only file left in the x64 leg's directory that overlapped, and
      # build-desktop-artifact.ts drops the fixed-name config dumps).
      #
      # Copied one at a time rather than with a single `cp -t`: that failed
      # with a bare "will not overwrite just-created" and named nothing useful,
      # which cost a release cycle to diagnose. A duplicate is still fatal —
      # silently shipping one leg's file as another's would be worse — but it
      # now says which file and which leg.
      - name: Stage desktop release assets
        run: |
          mkdir -p release-assets
          status=0
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "release-assets/$name" ]]; then
              echo "Duplicate desktop artifact name across legs: $name (from $file)" >&2
              status=1
              continue
            fi
            cp "$file" "release-assets/$name"
          done < <(find desktop-assets -mindepth 2 -maxdepth 2 -type f -print0)
          exit "$status"

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --generate-notes --verify-tag
