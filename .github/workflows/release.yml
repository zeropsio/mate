name: Release mate bundle

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to bake into the rehearsal bundle
        required: true
        default: 0.0.0-rehearsal
        type: string

permissions:
  contents: read

env:
  PNPM_CONFIG_FETCH_RETRIES: "2"
  PNPM_CONFIG_FETCH_TIMEOUT: "60000"
  PNPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  PNPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"

jobs:
  verify:
    name: Verify prior CI verdict
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout release and first parent
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: packages/shared/src

      - name: Check exact-SHA CI verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ci_verification() {
            local sha="$1"
            GH_VERIFIED_SHA="$sha" gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&status=success&per_page=100" --paginate --jq '
              .workflow_runs[]
              | select(.head_sha == env.GH_VERIFIED_SHA)
              | select(.path == ".github/workflows/ci.yml")
              | select(.head_branch == "main" or .head_branch == "kh-next")
              | select(.status == "completed" and .conclusion == "success")
              | .id'
          }
          verified_sha="$GITHUB_SHA"
          verified=$(ci_verification "$verified_sha")
          if [[ -z "$verified" ]]; then
            if parent=$(git rev-parse --verify "${GITHUB_SHA}^1" 2>/dev/null) &&
              packages=$(git show "${parent}:packages/shared/src/versionedReleasePackages.json" 2>/dev/null); then
              if git diff --no-renames --name-only -z "$parent" "$GITHUB_SHA" |
                jq -e --raw-input --slurp --argjson packages "$packages" '
                  split("\u0000") | map(select(length > 0))
                  | all(.[]; . as $path | $packages | index($path) != null)' > /dev/null; then
                verified_sha="$parent"
                verified=$(ci_verification "$verified_sha")
              fi
            fi
          fi
          if [[ -z "$verified" ]]; then
            echo "No completed successful CI run on main/kh-next for ${GITHUB_SHA} or its version-only first parent; run CI on this commit first." >&2
            exit 1
          fi
          echo "CI verified ${verified_sha} for release ${GITHUB_SHA} (run IDs: ${verified//$'\n'/, })."

  build:
    name: Build and verify bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: Restore pnpm metadata
        uses: actions/cache/restore@v4
        with:
          # Cache metadata only; lockfile-verified.jsonl must never skip a later run's check.
          path: ${{ runner.temp }}/pnpm-metadata/v11
          key: pnpm-metadata-${{ runner.os }}-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-metadata-${{ runner.os }}-pnpm11-

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve store path
        id: paths
        shell: bash
        run: |
          echo "store=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.paths.outputs.store }}
          key: vite-plus-${{ runner.os }}-${{ steps.paths.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vite-plus-${{ runner.os }}-${{ steps.paths.outputs.arch }}-pnpm-

      - name: Resolve bundle version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node -p "require('./apps/server/package.json').version")"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$package_version" != "$tag_version" ]]; then
              echo "Release tag version '$tag_version' does not match apps/server/package.json version '$package_version' (tag '$GITHUB_REF_NAME')." >&2
              echo "Bump apps/server/package.json before creating the release tag." >&2
              exit 1
            fi
            version="$package_version"
          else
            version="$DISPATCH_VERSION"
            echo "Rehearsal version '$version' deliberately overrides apps/server/package.json version '$package_version'; mate --version will report 'mate v$package_version'."
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid SemVer: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        # Tags reuse the verified SHA's policy check; rehearsals also verify locally.
        env:
          PNPM_CONFIG_CACHE_DIR: ${{ runner.temp }}/pnpm-metadata
          PNPM_CONFIG_TRUST_LOCKFILE: ${{ github.event_name == 'push' }}
        run: vp install --frozen-lockfile

      - name: Build server bundle
        run: node apps/server/scripts/cli.ts build

      # node-pty ships no Linux prebuild, so the tarball carries one of its own
      # (apps/server/scripts/bundleNodePty.ts) and the container never needs a
      # compiler. Built against bullseye's glibc 2.31 so it loads on any
      # newer image; the addon is N-API, so the Node major does not matter.
      - name: Build node-pty for linux-x64
        id: node_pty
        run: |
          version="$(node -p "require('./apps/server/node_modules/node-pty/package.json').version")"
          out="${RUNNER_TEMP}/node-pty-linux-x64"
          mkdir -p "$out"
          # Docker Hub refuses unauthenticated pulls from shared runners at times (rate limit, auth
          # outages: v0.15.23 failed twice), so the image comes from Google's Hub mirror first.
          image=""
          for candidate in mirror.gcr.io/library/node:22-bullseye node:22-bullseye; do
            for attempt in 1 2 3; do
              if docker pull -q "$candidate"; then image="$candidate"; break 2; fi
              sleep $((attempt * 10))
            done
          done
          [ -n "$image" ] || { echo "no node:22-bullseye image could be pulled"; exit 1; }
          docker run --rm -v "$out:/out" -e "NODE_PTY_VERSION=$version" "$image" bash -ec '
            mkdir /w && cd /w && npm init -y >/dev/null
            npm install --no-audit --no-fund "node-pty@${NODE_PTY_VERSION}"
            cp node_modules/node-pty/build/Release/pty.node /out/pty.node
          '
          file "$out/pty.node"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Build kernel health event helper
        run: |
          gcc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Os -static -s native/health-events/main.c -o apps/server/dist/health-events

      - name: Pack bundle
        id: pack
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          NODE_PTY_PREBUILD: ${{ steps.node_pty.outputs.dir }}
        run: |
          release_dir="${RUNNER_TEMP}/release-assets"
          mkdir -p "$release_dir"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node apps/server/scripts/cli.ts pack --out "$release_dir" --node-pty-prebuild "$NODE_PTY_PREBUILD"
          else
            node apps/server/scripts/cli.ts pack --out "$release_dir" --node-pty-prebuild "$NODE_PTY_PREBUILD" --app-version "$APP_VERSION"
          fi

          mapfile -d '' tarballs < <(find "$release_dir" -maxdepth 1 -type f -name '*.tgz' -print0)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected pack to write exactly one tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi

          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"
          echo "tarball_name=$(basename "${tarballs[0]}")" >> "$GITHUB_OUTPUT"
          ls -lh "${tarballs[0]}"

      - name: Verify tarball installation
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
        run: |
          install_prefix="$(mktemp -d "${RUNNER_TEMP}/mate-install.XXXXXX")"
          cp "$TARBALL" "$install_prefix/$TARBALL_NAME"
          cd "$install_prefix"
          npm init -y
          npm install "./$TARBALL_NAME"
          node -e 'require("node:assert/strict").equal(require("./node_modules/zerops-mate/package.json").mate.hqOrigin, "https://mate-hq.zerops.io")'

          installed_version="$(./node_modules/.bin/mate --version)"
          echo "Installed binary version: $installed_version"

          test -x ./node_modules/zerops-mate/dist/health-events

          # The bundled node-pty must have satisfied npm without a compiler:
          # a build/ directory means node-gyp ran, which the container cannot.
          node_pty_dir="./node_modules/zerops-mate/node_modules/node-pty"
          test -f "$node_pty_dir/prebuilds/linux-x64/pty.node"
          if [[ -d "$node_pty_dir/build" ]]; then
            echo "node-pty was compiled during install; the bundled prebuild was not used." >&2
            exit 1
          fi

          # The manifest declares only the native addons the bundle still loads
          # from disk; everything else is inlined. `--version` proves the static
          # import graph resolves — these prove the addons themselves open, which
          # is the failure the prune could otherwise hide until a container boots.
          node --input-type=commonjs -e '
            // Resolve as the server would: node-pty is bundled under zerops-mate.
            const { createRequire } = require("node:module");
            const req = createRequire(require.resolve("zerops-mate/package.json"));
            const pty = req("node-pty");
            if (typeof pty.spawn !== "function") throw new Error("node-pty did not load");
            if (typeof require("msgpackr-extract").extractStrings !== "function") {
              throw new Error("msgpackr-extract did not load");
            }
            console.log("native addons loaded");
          '

      - name: Write checksum
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          release_dir="$(dirname "$TARBALL")"
          tarball_name="$(basename "$TARBALL")"
          cd "$release_dir"
          sha256sum "$tarball_name" > SHA256SUMS
          cat SHA256SUMS

      - name: Write stable.json
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_dir="$(dirname "$TARBALL")"
          sha256="$(cd "$release_dir" && sha256sum "$TARBALL_NAME" | cut -d ' ' -f1)"
          size="$(stat -c%s "$TARBALL" 2>/dev/null || stat -f%z "$TARBALL")"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Only the preceding published stable release can establish the rollback floor.
          # A missing/unreadable release leaves the gate closed and still permits manual updates.
          previous_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          node apps/server/scripts/releaseManifestAsset.ts \
            --version "$APP_VERSION" \
            --asset "$TARBALL_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "v$APP_VERSION" \
            --sha256 "$sha256" \
            --size "$size" \
            --published-at "$published_at" \
            --previous-tag "$previous_tag" \
            --out "$release_dir/stable.json"
          cat "$release_dir/stable.json"

      - name: Verify serve --help advertises contract 2
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
        run: |
          install_prefix="$(mktemp -d "${RUNNER_TEMP}/mate-contract-check.XXXXXX")"
          cp "$TARBALL" "$install_prefix/$TARBALL_NAME"
          cd "$install_prefix"
          npm init -y
          npm install "./$TARBALL_NAME"
          node -e 'require("node:assert/strict").equal(require("./node_modules/zerops-mate/package.json").mate.hqOrigin, "https://mate-hq.zerops.io")'
          help_output="$(./node_modules/.bin/mate serve --help)"
          for flag in --mode --host --port --base-path --base-dir --no-browser --auto-bootstrap-project-from-cwd; do
            if ! grep -q -- "$flag" <<<"$help_output"; then
              echo "serve --help does not advertise contract-2 flag '$flag'." >&2
              exit 1
            fi
          done
          echo "serve --help advertises every contract-2 flag."

      - name: Stage verified release assets
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mate-release-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/release-assets/SHA256SUMS
            ${{ runner.temp }}/release-assets/stable.json
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: mate-release-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Verify downloaded release assets
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # An upload can fail after GitHub creates the release record. A retry completes it.
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes --verify-tag --latest
          fi
